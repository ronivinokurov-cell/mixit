/* ===== ORGANIZER: calendar, tasks, study, goals ===== */
const EV_TYPES = {
  event: { label: 'אירוע', icon: '📅', color: '#8B5CF6' },
  birthday: { label: 'יום הולדת', icon: '🎂', color: '#F472B6' },
  exam: { label: 'מבחן', icon: '📚', color: '#F59E0B' },
  reminder: { label: 'תזכורת', icon: '🔔', color: '#38BDF8' }
};

const Organizer = {
  tabs() {
    return [
      ['calendar', '🗓️ יומן'], ['tasks', '✅ משימות'], ['study', '📚 לימודים'],
      ['goals', '🎯 מטרות'], ['lists', '🛒 רשימות'], ['budget', '💰 תקציב'],
      ['timetable', '🕘 מערכת שעות'], ['timers', '⏱️ טיימרים'], ['countdown', '⏳ ספירה לאחור'],
      ['summary', '📈 סיכום שבועי'], ['notes', '📝 הערות']
    ];
  },
  render(view) {
    const tab = UI.tab.organizer || 'calendar';
    let html = '<div class="shell">' +
      '<div class="row" style="margin-bottom:12px"><div class="sp"><div class="h1">MIXIT ORGANIZER</div>' +
      '<div class="sub">היום שלך, מסודר במקום אחד</div></div>' +
      '<button class="icon-btn" data-search>🔍</button></div>' +
      '<div class="tabs" style="margin-bottom:14px">' +
      this.tabs().map((t) => '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') +
      '</div><div id="org-body"></div></div>';
    view.innerHTML = html;
    $$('[data-tab]', view).forEach((b) => {
      b.onclick = () => { UI.tab.organizer = b.dataset.tab; this.render(view); };
    });
    const s = $('[data-search]', view); if (s) s.onclick = openSearch;
    const body = $('#org-body', view);
    const map = {
      calendar: () => this.calendar(body), tasks: () => this.tasks(body), study: () => this.study(body),
      goals: () => this.goals(body), lists: () => this.lists(body), budget: () => this.budget(body),
      timetable: () => this.timetable(body), timers: () => this.timersTab(body), countdown: () => this.countdown(body),
      summary: () => this.summary(body), notes: () => this.notes(body)
    };
    (map[tab] || map.calendar)();
  },

  /* ---------- calendar ---------- */
  calendar(box) {
    const now = new Date();
    if (!UI.cal.month) UI.cal.month = { y: now.getFullYear(), m: now.getMonth() };
    if (!UI.cal.sel) UI.cal.sel = todayISO();
    const { y, m } = UI.cal.month;
    const first = new Date(y, m, 1);
    const startDow = first.getDay();
    const daysIn = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const byDate = {};
    S.events.forEach((e) => { (byDate[e.date] = byDate[e.date] || []).push(e); });

    let cells = '';
    for (let i = 0; i < startDow; i++) {
      const d = prevDays - startDow + i + 1;
      cells += '<div class="cal-day out">' + d + '</div>';
    }
    for (let d = 1; d <= daysIn; d++) {
      const dateStr = iso(new Date(y, m, d));
      const evs = byDate[dateStr] || [];
      const isToday = dateStr === todayISO();
      const sel = dateStr === UI.cal.sel;
      cells += '<button class="cal-day ' + (isToday ? 'today ' : '') + (sel && !isToday ? 'sel ' : '') + '" data-date="' + dateStr + '">' + d +
        '<span class="dots">' + evs.slice(0, 3).map((e) => '<i style="background:' + EV_TYPES[e.type].color + '"></i>').join('') + '</span></button>';
    }
    const total = startDow + daysIn;
    for (let d = 1; d <= (42 - total); d++) cells += '<div class="cal-day out">' + d + '</div>';

    const selEvents = (byDate[UI.cal.sel] || []).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    const upcoming = S.events.filter((e) => !e.done && daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6);

    box.innerHTML =
      '<div class="card">' +
      '<div class="cal-head"><button class="icon-btn" data-prev>›</button>' +
      '<div class="h2">' + HEB_MONTHS[m] + ' ' + y + '</div>' +
      '<button class="icon-btn" data-next>‹</button></div>' +
      '<div class="cal-grid">' + HEB_DOW_S.map((d) => '<div class="cal-dow">' + d + '</div>').join('') + '</div>' +
      '<div class="cal-grid" style="margin-top:4px">' + cells + '</div>' +
      '<div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">' +
      Object.keys(EV_TYPES).map((k) => '<span class="badge" style="background:' + EV_TYPES[k].color + '22;color:' + EV_TYPES[k].color + '">' + EV_TYPES[k].icon + ' ' + EV_TYPES[k].label + '</span>').join('') +
      '</div></div>' +

      '<div class="section"><div class="section-head"><div class="h2">' + fmtLong(UI.cal.sel) + '</div>' +
      '<button class="btn soft xs" data-add-event>+ אירוע</button></div>' +
      (selEvents.length ? '<div class="list-plain">' + selEvents.map((e) => this.eventRow(e)).join('') + '</div>'
        : '<div class="empty">אין כלום ביום הזה. יום פנוי או הזדמנות להוסיף 🎈</div>') +
      '</div>' +

      '<div class="section"><div class="section-head"><div class="h2">⏭️ בקרוב</div></div>' +
      (upcoming.length ? '<div class="list-plain">' + upcoming.map((e) => this.eventRow(e, true)).join('') + '</div>'
        : '<div class="empty">אין אירועים קרובים</div>') + '</div>';

    const move = (dir) => {
      let nm = m + dir, ny = y;
      if (nm < 0) { nm = 11; ny--; } if (nm > 11) { nm = 0; ny++; }
      UI.cal.month = { y: ny, m: nm };
      this.calendar(box);
    };
    $('[data-prev]', box).onclick = () => move(-1);
    $('[data-next]', box).onclick = () => move(1);
    $$('[data-date]', box).forEach((b) => { b.onclick = () => { UI.cal.sel = b.dataset.date; this.calendar(box); }; });
    $('[data-add-event]', box).onclick = () => Actions.addEvent({ date: UI.cal.sel });
    this.bindEvents(box);
  },

  eventRow(e, showDate) {
    const t = EV_TYPES[e.type] || EV_TYPES.event;
    return '<div class="item ' + (e.done ? 'done' : '') + '" data-evrow="' + e.id + '">' +
      '<button class="check ' + (e.done ? 'on' : '') + '" data-evtoggle="' + e.id + '">✓</button>' +
      '<span class="sp" data-evopen="' + e.id + '" style="cursor:pointer">' +
      '<span class="item-title">' + t.icon + ' ' + esc(e.title) + '</span>' +
      '<span class="item-sub">' + (showDate ? fmtLong(e.date) + ' · ' : '') + esc(e.time || 'כל היום') + (e.notes ? ' · ' + esc(e.notes) : '') + '</span></span>' +
      '<span class="badge" style="background:' + t.color + '22;color:' + t.color + '">' + t.label + '</span>' +
      '<button class="del" data-evdel="' + e.id + '">🗑</button></div>';
  },

  bindEvents(box) {
    $$('[data-evtoggle]', box).forEach((b) => { b.onclick = () => Actions.toggleEvent(b.dataset.evtoggle); });
    $$('[data-evdel]', box).forEach((b) => {
      b.onclick = () => confirmSheet('למחוק אירוע?', 'האירוע יימחק מהיומן.', () => {
        S.events = S.events.filter((x) => x.id !== b.dataset.evdel); save(); toast('האירוע נמחק', 'ok'); render();
      });
    });
    $$('[data-evopen]', box).forEach((b) => {
      b.onclick = () => {
        const e = S.events.find((x) => x.id === b.dataset.evopen);
        if (!e) return;
        formSheet('עריכת אירוע', [
          { name: 'title', label: 'שם', value: e.title, required: true },
          { name: 'type', label: 'סוג', type: 'select', options: Object.keys(EV_TYPES).map((k) => ({ v: k, t: EV_TYPES[k].label })), value: e.type },
          { name: 'date', label: 'תאריך', type: 'date', value: e.date, required: true },
          { name: 'time', label: 'שעה', type: 'time', value: e.time },
          { name: 'notes', label: 'הערות', type: 'textarea', value: e.notes }
        ], (v) => {
          Object.assign(e, v, { notified: false });
          save(); toast('האירוע עודכן', 'ok'); render();
        }, 'עדכון');
      };
    });
  },

  /* ---------- tasks ---------- */
  tasks(box) {
    const f = UI.tab.taskFilter || 'open';
    const t = todayISO();
    let list = S.tasks.slice();
    if (f === 'open') list = list.filter((x) => !x.done);
    if (f === 'today') list = list.filter((x) => !x.done && x.due && x.due <= t);
    if (f === 'done') list = list.filter((x) => x.done);
    list.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const pa = a.priority === 'high' ? 0 : a.priority === 'low' ? 2 : 1;
      const pb = b.priority === 'high' ? 0 : b.priority === 'low' ? 2 : 1;
      if (pa !== pb) return pa - pb;
      return (a.due || '9999').localeCompare(b.due || '9999');
    });
    const counts = {
      open: S.tasks.filter((x) => !x.done).length,
      today: S.tasks.filter((x) => !x.done && x.due && x.due <= t).length,
      done: S.tasks.filter((x) => x.done).length
    };
    box.innerHTML =
      '<div class="row" style="margin-bottom:12px"><div class="chips sp">' +
      [['open', 'פתוחות (' + counts.open + ')'], ['today', 'להיום (' + counts.today + ')'], ['done', 'הושלמו (' + counts.done + ')'], ['all', 'הכל']].map((c) =>
        '<button class="chip ' + (f === c[0] ? 'on' : '') + '" data-filter="' + c[0] + '">' + c[1] + '</button>').join('') +
      '</div><button class="btn sm" data-add>+ חדשה</button></div>' +
      (list.length ? '<div class="list-plain">' + list.map((x) => this.taskRow(x)).join('') + '</div>'
        : '<div class="empty">' + (f === 'done' ? 'עוד לא סימנת משימות כהושלמו' : 'אין משימות כאן. מוסיפים אחת?') + '</div>') +
      (f === 'done' && counts.done ? '<button class="btn ghost block" style="margin-top:12px" data-clear>נקה משימות שהושלמו</button>' : '');

    $$('[data-filter]', box).forEach((b) => { b.onclick = () => { UI.tab.taskFilter = b.dataset.filter; this.tasks(box); }; });
    $('[data-add]', box).onclick = () => Actions.addTask();
    const cl = $('[data-clear]', box);
    if (cl) cl.onclick = () => confirmSheet('לנקות הושלמו?', 'כל המשימות המסומנות יימחקו.', () => {
      S.tasks = S.tasks.filter((x) => !x.done); save(); toast('נוקה', 'ok'); render();
    });
    $$('[data-task]', box).forEach((b) => { b.onclick = () => Actions.toggleTask(b.dataset.task); });
    $$('[data-open-task]', box).forEach((b) => { b.onclick = () => this.taskDetail(b.dataset.openTask); });
    $$('[data-del-task]', box).forEach((b) => {
      b.onclick = () => confirmSheet('למחוק משימה?', 'אי אפשר לשחזר.', () => {
        S.tasks = S.tasks.filter((x) => x.id !== b.dataset.delTask); save(); toast('נמחק', 'ok'); render();
      });
    });
  },

  taskRow(x) {
    return '<div class="item ' + (x.done ? 'done' : '') + '">' +
      '<button class="check ' + (x.done ? 'on' : '') + '" data-task="' + x.id + '">✓</button>' +
      '<span class="sp" data-open-task="' + x.id + '" style="cursor:pointer">' +
      '<span class="item-title">' + esc(x.title) + '</span>' +
      '<span class="item-sub">' + (x.priority === 'high' ? '🔴 דחוף · ' : x.priority === 'low' ? '🔵 בהמשך · ' : '') +
      (x.due ? fmtNice(x.due) : 'בלי תאריך') + (x.notes ? ' · ' + esc(x.notes.slice(0, 40)) : '') + '</span></span>' +
      (x.image ? '<img src="' + x.image + '" alt="" style="width:38px;height:38px;border-radius:10px;object-fit:cover">' : '') +
      '<button class="del" data-del-task="' + x.id + '">🗑</button></div>';
  },

  taskDetail(id) {
    const t = S.tasks.find((x) => x.id === id);
    if (!t) return;
    openSheet({
      title: 'פרטי משימה',
      body:
        '<div class="field" style="margin-bottom:10px"><label>מה לעשות</label><input class="input" id="td-title" value="' + esc(t.title) + '"></div>' +
        '<div class="grid g2" style="margin-bottom:10px">' +
        '<div class="field"><label>תאריך</label><input class="input" type="date" id="td-due" value="' + esc(t.due || '') + '"></div>' +
        '<div class="field"><label>עדיפות</label><select class="input" id="td-pri">' +
        ['high', 'normal', 'low'].map((p) => '<option value="' + p + '"' + (t.priority === p ? ' selected' : '') + '>' + (p === 'high' ? 'דחוף' : p === 'low' ? 'בהמשך' : 'רגיל') + '</option>').join('') +
        '</select></div></div>' +
        '<div class="field" style="margin-bottom:10px"><label>הערות</label><textarea class="input" id="td-notes">' + esc(t.notes || '') + '</textarea></div>' +
        '<div class="field" style="margin-bottom:12px"><label>תמונה</label>' +
        '<div class="row">' + (t.image ? '<img src="' + t.image + '" alt="" style="width:64px;height:64px;border-radius:12px;object-fit:cover">' : '') +
        '<button class="btn ghost sm" id="td-img">' + (t.image ? 'החלפת תמונה' : '📷 הוספת תמונה') + '</button>' +
        (t.image ? '<button class="btn danger sm" id="td-imgdel">הסרה</button>' : '') + '</div></div>' +
        '<div class="row"><button class="btn block" id="td-save">שמירה</button>' +
        '<button class="btn ghost block" id="td-done">' + (t.done ? 'סימון כפתוחה' : 'סימון כהושלמה') + '</button></div>',
      onMount: (root) => {
        root.querySelector('#td-img').onclick = () => pickImage((d) => { t.image = d; save(); closeSheet(); render(); toast('התמונה נוספה', 'ok'); }, 900);
        const dl = root.querySelector('#td-imgdel');
        if (dl) dl.onclick = () => { t.image = null; save(); closeSheet(); render(); };
        root.querySelector('#td-save').onclick = () => {
          t.title = root.querySelector('#td-title').value.trim() || t.title;
          t.due = root.querySelector('#td-due').value;
          t.priority = root.querySelector('#td-pri').value;
          t.notes = root.querySelector('#td-notes').value;
          save(); closeSheet(); render(); toast('המשימה עודכנה', 'ok');
        };
        root.querySelector('#td-done').onclick = () => { closeSheet(); Actions.toggleTask(t.id); };
      }
    });
  },

  /* ---------- study ---------- */
  study(box) {
    const exams = S.events.filter((e) => e.type === 'exam' && !e.done).sort((a, b) => a.date.localeCompare(b.date));
    const hw = S.homework.slice().sort((a, b) => (a.done - b.done) || (a.due || '').localeCompare(b.due || ''));
    const openHw = hw.filter((h) => !h.done);
    const weekHw = hw.filter((h) => h.done && isSameWeek(h.due || todayISO())).length;
    box.innerHTML =
      '<div class="grid g3" style="margin-bottom:14px">' +
      '<div class="stat"><b>' + openHw.length + '</b><span>שיעורי בית פתוחים</span></div>' +
      '<div class="stat"><b>' + exams.length + '</b><span>מבחנים קרובים</span></div>' +
      '<div class="stat"><b>' + weekHw + '</b><span>הושלמו השבוע</span></div></div>' +
      '<div class="section-head"><div class="h2">📚 שיעורי בית</div><button class="btn soft xs" data-add-hw>+ הוספה</button></div>' +
      (hw.length ? '<div class="list-plain">' + hw.map((h) => '<div class="item ' + (h.done ? 'done' : '') + '">' +
        '<button class="check ' + (h.done ? 'on' : '') + '" data-hw="' + h.id + '">✓</button>' +
        '<span class="sp"><span class="item-title">' + esc(h.title) + '</span><span class="item-sub">' + esc(h.subject) + ' · ' + fmtNice(h.due) + (h.notes ? ' · ' + esc(h.notes) : '') + '</span></span>' +
        '<button class="del" data-del-hw="' + h.id + '">🗑</button></div>').join('') + '</div>'
        : '<div class="empty">אין שיעורי בית. מוסיפים את הראשון?</div>') +
      '<div class="section"><div class="section-head"><div class="h2">✏️ מבחנים</div><button class="btn soft xs" data-add-exam>+ מבחן</button></div>' +
      (exams.length ? '<div class="list-plain">' + exams.map((e) => '<div class="item">' +
        '<span style="font-size:18px">📚</span><span class="sp"><span class="item-title">' + esc(e.title) + '</span>' +
        '<span class="item-sub">' + fmtLong(e.date) + (e.time ? ' · ' + esc(e.time) : '') + ' · ' + (daysUntil(e.date) === 0 ? 'היום!' : 'בעוד ' + daysUntil(e.date) + ' ימים') + '</span></span>' +
        '<button class="btn ghost xs" data-study-plan="' + e.id + '">תוכנית</button></div>').join('') + '</div>'
        : '<div class="empty">אין מבחנים ביומן</div>') + '</div>' +
      '<div class="section"><div class="card tight"><div class="h3" style="margin-bottom:6px">💡 טיפ ללמידה</div>' +
      '<div class="sub">שיטת 25/5: 25 דקות למידה ממוקדת, 5 דקות הפסקה. אחרי 4 סבבים — הפסקה ארוכה. אפשר להפעיל טיימר מהטאב “טיימרים”.</div>' +
      '<button class="btn ghost sm" style="margin-top:10px" data-study-timer>⏱️ הפעלת טיימר 25 דקות</button></div></div>';

    $('[data-add-hw]', box).onclick = () => formSheet('שיעורי בית חדש', [
      { name: 'subject', label: 'מקצוע', required: true, ph: 'מתמטיקה, היסטוריה…' },
      { name: 'title', label: 'מה צריך להכין?', required: true },
      { name: 'due', label: 'להגשה עד', type: 'date', value: iso(addDays(new Date(), 2)) },
      { name: 'notes', label: 'פרטים', type: 'textarea' }
    ], (v) => {
      S.homework.push({ id: uid('hw'), subject: v.subject, title: v.title, due: v.due, notes: v.notes, done: false, notified: false });
      save(); toast('נוסף ללימודים', 'ok'); render();
    }, 'הוספה');
    $('[data-add-exam]', box).onclick = () => Actions.addEvent({ type: 'exam', date: iso(addDays(new Date(), 5)) });
    $$('[data-hw]', box).forEach((b) => {
      b.onclick = () => {
        const h = S.homework.find((x) => x.id === b.dataset.hw);
        if (!h) return;
        h.done = !h.done; save();
        if (h.done) { toast('שיעורי בית הושלמו 🎉', 'ok'); S.stats.tasksDone = (S.stats.tasksDone || 0) + 1; checkAchievements(); }
        render();
      };
    });
    $$('[data-del-hw]', box).forEach((b) => {
      b.onclick = () => { S.homework = S.homework.filter((x) => x.id !== b.dataset.delHw); save(); render(); toast('נמחק', 'ok'); };
    });
    $$('[data-study-plan]', box).forEach((b) => {
      b.onclick = () => {
        const e = S.events.find((x) => x.id === b.dataset.studyPlan);
        if (!e) return;
        const d = daysUntil(e.date);
        const plan = d <= 0 ? ['חזרה מהירה על הסיכומים', 'פתרון שאלה אחת מכל נושא', 'שינה טובה לפני המבחן']
          : d === 1 ? ['חזרה על נושאים חלשים', 'תרגול 3 שאלות', 'סידור ציוד ומנוחה']
            : ['חלוקה: ' + Math.max(1, d - 1) + ' ימים של למידה', 'כל יום 45 דקות + סיכום קצר', 'יום לפני: חזרה בלבד'];
        openSheet({
          title: 'תוכנית ל' + e.title,
          body: '<div class="stack">' + plan.map((p, i) => '<div class="item"><span class="badge">' + (i + 1) + '</span><span class="sp item-title">' + esc(p) + '</span></div>').join('') + '</div>' +
            '<button class="btn block" style="margin-top:14px" id="plan-timer">⏱️ להתחיל 25 דקות למידה</button>',
          onMount: (root) => { root.querySelector('#plan-timer').onclick = () => { closeSheet(); Timers.open(25); }; }
        });
      };
    });
    $('[data-study-timer]', box).onclick = () => Timers.open(25);
  },

  /* ---------- goals ---------- */
  goals(box) {
    const gs = S.goals.slice();
    const doneCount = gs.filter((g) => Number(g.current) >= Number(g.target) && Number(g.target) > 0).length;
    box.innerHTML =
      '<div class="row" style="margin-bottom:12px"><div class="sp"><div class="h2">🎯 המטרות שלי</div>' +
      '<div class="tiny">' + doneCount + ' הושגו מתוך ' + gs.length + '</div></div>' +
      '<button class="btn sm" data-add-goal>+ מטרה</button></div>' +
      (gs.length ? '<div class="stack">' + gs.map((g) => {
        const pct = Math.min(100, Math.round((Number(g.current) / Math.max(1, Number(g.target))) * 100));
        const done = pct >= 100;
        return '<div class="card tight">' +
          '<div class="row" style="margin-bottom:8px"><span class="sp"><div class="h3">' + (done ? '🏆 ' : '') + esc(g.title) + '</div>' +
          '<div class="tiny">' + g.current + ' / ' + g.target + ' ' + esc(g.unit || '') + (g.deadline ? ' · עד ' + fmtShort(g.deadline) : '') + '</div></span>' +
          '<button class="del" data-del-goal="' + g.id + '">🗑</button></div>' +
          '<div class="bar ' + (done ? 'sage' : '') + '"><i style="width:' + pct + '%"></i></div>' +
          '<div class="row" style="margin-top:10px;gap:6px">' +
          '<button class="btn ghost xs" data-goal-step="' + g.id + '" data-step="1">+1</button>' +
          '<button class="btn ghost xs" data-goal-step="' + g.id + '" data-step="5">+5</button>' +
          '<button class="btn ghost xs" data-goal-step="' + g.id + '" data-step="-1">−1</button>' +
          '<span class="sp"></span><span class="badge ' + (done ? 'sage' : '') + '">' + pct + '%</span></div>' +
          '</div>';
      }).join('') + '</div>' : '<div class="empty">עוד לא הצבת מטרות. מטרה אחת קטנה מתחילה הכל 🎯</div>') +
      '<div class="section"><div class="card tight"><div class="h3" style="margin-bottom:5px">רעיונות למטרות</div>' +
      '<div class="chips">' + ['לקרוא 3 ספרים', '30 אימונים', 'לחסוך 300 ₪', '10 עיצובים', '20 ימי כתיבה'].map((x) => '<button class="chip mini" data-quick-goal="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div></div></div>';

    $('[data-add-goal]', box).onclick = () => Actions.addGoal();
    $$('[data-quick-goal]', box).forEach((b) => {
      b.onclick = () => {
        const t = b.dataset.quickGoal;
        S.goals.push({ id: uid('g'), title: t, target: Number((t.match(/\d+/) || [10])[0]), current: 0, unit: '', deadline: '', created: todayISO() });
        save(); toast('מטרה נוספה', 'ok'); render();
      };
    });
    $$('[data-goal-step]', box).forEach((b) => {
      b.onclick = () => {
        const g = S.goals.find((x) => x.id === b.dataset.goalStep);
        if (!g) return;
        const before = Number(g.current) >= Number(g.target);
        g.current = Math.max(0, Number(g.current) + Number(b.dataset.step));
        save();
        if (!before && Number(g.current) >= Number(g.target)) { toast('הגעת ליעד! 🏆 ' + g.title, 'ok', 3200); checkAchievements(); }
        render();
      };
    });
    $$('[data-del-goal]', box).forEach((b) => {
      b.onclick = () => confirmSheet('למחוק מטרה?', 'ההתקדמות שלה תימחק.', () => {
        S.goals = S.goals.filter((x) => x.id !== b.dataset.delGoal); save(); render(); toast('נמחק', 'ok');
      });
    });
  }
};


/* ===== screen-organizer-b.js ===== */
/* ===== ORGANIZER part B: lists, budget, timetable, timers, countdown, summary, notes ===== */
const BUDGET_CATS = ['אוכל', 'תחבורה', 'בילויים', 'קניות', 'לימודים', 'מתנות', 'בריאות', 'אחר'];
const BUDGET_COLORS = ['#8B5CF6', '#38BDF8', '#F472B6', '#8FB89A', '#E6A96B', '#C084FC', '#6EC6E8', '#B0A8C9'];

Object.assign(Organizer, {
  /* ---------- lists ---------- */
  lists(box) {
    const shopOpen = S.shopping.filter((s) => !s.done);
    const wishTotal = S.wishes.filter((w) => !w.got).reduce((a, w) => a + (Number(w.price) || 0), 0);
    box.innerHTML =
      '<div class="card">' +
      '<div class="row" style="margin-bottom:10px"><div class="h2 sp">🛒 רשימת קניות</div>' +
      '<span class="badge">' + shopOpen.length + ' פריטים</span></div>' +
      '<div class="row" style="gap:8px;margin-bottom:12px"><input class="input" id="shop-quick" placeholder="מה חסר בבית?">' +
      '<button class="btn sm" id="shop-add">+</button></div>' +
      (S.shopping.length ? '<div class="list-plain">' + S.shopping.map((s) => '<div class="item ' + (s.done ? 'done' : '') + '">' +
        '<button class="check ' + (s.done ? 'on' : '') + '" data-shop="' + s.id + '">✓</button>' +
        '<span class="sp"><span class="item-title">' + esc(s.name) + '</span>' + (s.qty ? '<span class="item-sub">' + esc(s.qty) + '</span>' : '') + '</span>' +
        '<button class="del" data-del-shop="' + s.id + '">🗑</button></div>').join('') + '</div>'
        : '<div class="empty">הרשימה ריקה. מה צריך לקנות?</div>') +
      (S.shopping.some((s) => s.done) ? '<button class="btn ghost block sm" style="margin-top:10px" id="shop-clear">הסרת מה שנקנה</button>' : '') +
      '</div>' +

      '<div class="card" style="margin-top:14px">' +
      '<div class="row" style="margin-bottom:10px"><div class="h2 sp">🎁 רשימת משאלות</div>' +
      '<button class="btn soft xs" id="wish-add">+ משאלה</button></div>' +
      '<div class="tiny" style="margin-bottom:10px">סה״כ משאלות פתוחות: ' + wishTotal + ' ₪</div>' +
      (S.wishes.length ? '<div class="list-plain">' + S.wishes.map((w) => '<div class="item ' + (w.got ? 'done' : '') + '">' +
        '<button class="check ' + (w.got ? 'on' : '') + '" data-wish="' + w.id + '">✓</button>' +
        '<span class="sp"><span class="item-title">' + esc(w.title) + '</span><span class="item-sub">' +
        (w.price ? w.price + ' ₪' : 'בלי מחיר') + (w.note ? ' · ' + esc(w.note) : '') + '</span></span>' +
        '<button class="del" data-del-wish="' + w.id + '">🗑</button></div>').join('') + '</div>'
        : '<div class="empty">מה בא לך לקבל או להשיג? רשמו כאן ✨</div>') +
      '</div>' +

      '<div class="section"><div class="card tight"><div class="row"><span style="font-size:20px">📝</span>' +
      '<div class="sp"><div class="h3">הערות מהירות</div><div class="tiny">' + S.notes.length + ' הערות שמורות</div></div>' +
      '<button class="btn ghost xs" id="go-notes">פתיחה</button></div></div></div>';

    const quick = $('[data-none]', box);
    const inp = $('#shop-quick', box);
    const addShop = () => {
      const v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      S.shopping.push({ id: uid('s'), name: v, qty: '', done: false });
      save(); toast('נוסף לרשימה', 'ok'); this.lists(box);
    };
    $('#shop-add', box).onclick = addShop;
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') addShop(); });
    const clr = $('#shop-clear', box);
    if (clr) clr.onclick = () => { S.shopping = S.shopping.filter((s) => !s.done); save(); this.lists(box); toast('הרשימה נוקתה', 'ok'); };
    $('#wish-add', box).onclick = () => Actions.addWish();
    $('#go-notes', box).onclick = () => { UI.tab.organizer = 'notes'; this.render(document.getElementById('view')); };
    $$('[data-shop]', box).forEach((b) => {
      b.onclick = () => { const s = S.shopping.find((x) => x.id === b.dataset.shop); if (!s) return; s.done = !s.done; save(); this.lists(box); };
    });
    $$('[data-del-shop]', box).forEach((b) => {
      b.onclick = () => { S.shopping = S.shopping.filter((x) => x.id !== b.dataset.delShop); save(); this.lists(box); };
    });
    $$('[data-wish]', box).forEach((b) => {
      b.onclick = () => { const w = S.wishes.find((x) => x.id === b.dataset.wish); if (!w) return; w.got = !w.got; save(); if (w.got) toast('איזה כיף! 🎁', 'ok'); this.lists(box); };
    });
    $$('[data-del-wish]', box).forEach((b) => {
      b.onclick = () => { S.wishes = S.wishes.filter((x) => x.id !== b.dataset.delWish); save(); this.lists(box); };
    });
  },

  /* ---------- budget ---------- */
  budget(box) {
    const now = new Date();
    const ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const monthEntries = S.budget.entries.filter((e) => (e.date || '').startsWith(ym));
    const expense = monthEntries.filter((e) => e.type === 'expense').reduce((a, e) => a + Number(e.amount || 0), 0);
    const income = monthEntries.filter((e) => e.type === 'income').reduce((a, e) => a + Number(e.amount || 0), 0);
    const limit = Number(S.budget.limit || 0);
    const remain = limit - expense;
    const pct = limit ? Math.min(100, Math.round((expense / limit) * 100)) : 0;
    const byCat = {};
    monthEntries.filter((e) => e.type === 'expense').forEach((e) => { byCat[e.cat || 'אחר'] = (byCat[e.cat || 'אחר'] || 0) + Number(e.amount || 0); });
    const cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);

    box.innerHTML =
      '<div class="card">' +
      '<div class="row" style="margin-bottom:12px"><div class="sp"><div class="h2">💰 תקציב ' + HEB_MONTHS[now.getMonth()] + '</div>' +
      '<div class="tiny">הוצאות מול תקציב חודשי</div></div>' +
      '<button class="btn sm" id="b-add">+ הוצאה</button></div>' +
      '<div class="grid g3" style="margin-bottom:12px">' +
      '<div class="stat"><b>' + expense + ' ₪</b><span>הוצאות</span></div>' +
      '<div class="stat"><b>' + income + ' ₪</b><span>הכנסות</span></div>' +
      '<div class="stat"><b style="color:' + (remain < 0 ? '#C2334D' : 'var(--brand)') + '">' + remain + ' ₪</b><span>' + (limit ? 'נשאר מהתקציב' : 'לא הוגדר תקציב') + '</span></div>' +
      '</div>' +
      '<div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="tiny" style="font-weight:800">' + (limit ? pct + '% מהתקציב' : 'הגדירו תקציב חודשי') + '</span>' +
      '<button class="tiny" id="b-limit" style="text-decoration:underline;font-weight:800">' + (limit ? 'עריכה' : 'הגדרה') + '</button></div>' +
      '<div class="bar ' + (pct > 85 ? 'pink' : '') + '"><i style="width:' + pct + '%"></i></div>' +
      (limit && remain < 0 ? '<div class="badge red" style="margin-top:10px">חריגה של ' + Math.abs(remain) + ' ₪</div>' : '') +
      '</div>' +

      (cats.length ? '<div class="section"><div class="section-head"><div class="h2">פילוח לפי קטגוריה</div></div><div class="card tight">' +
        cats.map((c, i) => '<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between;font-size:12.5px;font-weight:700"><span>' + esc(c) + '</span><span>' + byCat[c] + ' ₪</span></div>' +
          '<div class="bar" style="height:7px;margin-top:4px"><i style="width:' + Math.round((byCat[c] / expense) * 100) + '%;background:' + BUDGET_COLORS[i % BUDGET_COLORS.length] + '"></i></div></div>').join('') +
        '</div></div>' : '') +

      '<div class="section"><div class="section-head"><div class="h2">תנועות החודש</div><span class="badge">' + monthEntries.length + '</span></div>' +
      (monthEntries.length ? '<div class="list-plain">' + monthEntries.slice().reverse().map((e) => '<div class="item">' +
        '<span style="font-size:17px">' + (e.type === 'income' ? '💵' : '🧾') + '</span>' +
        '<span class="sp"><span class="item-title">' + esc(e.desc) + '</span><span class="item-sub">' + esc(e.cat || 'אחר') + ' · ' + fmtShort(e.date) + '</span></span>' +
        '<b style="color:' + (e.type === 'income' ? '#3F6B4C' : '#8B5CF6') + '">' + (e.type === 'income' ? '+' : '−') + Number(e.amount) + ' ₪</b>' +
        '<button class="del" data-del-b="' + e.id + '">🗑</button></div>').join('') + '</div>'
        : '<div class="empty">עוד אין תנועות החודש. מוסיפים הוצאה ראשונה?</div>') + '</div>';

    $('#b-add', box).onclick = () => this.budgetForm();
    $('#b-limit', box).onclick = () => formSheet('תקציב חודשי', [
      { name: 'limit', label: 'תקציב לחודש (₪)', type: 'number', min: 0, value: S.budget.limit || 0, required: true }
    ], (v) => { S.budget.limit = Number(v.limit) || 0; save(); toast('התקציב עודכן', 'ok'); checkAchievements(); this.budget(box); }, 'שמירה');
    $$('[data-del-b]', box).forEach((b) => {
      b.onclick = () => { S.budget.entries = S.budget.entries.filter((x) => x.id !== b.dataset.delB); save(); this.budget(box); toast('נמחק', 'ok'); };
    });
  },

  budgetForm() {
    formSheet('תנועה חדשה', [
      { name: 'desc', label: 'על מה?', required: true, ph: 'קפה, אוטובוס, מתנה…' },
      { name: 'amount', label: 'סכום (₪)', type: 'number', min: 0, required: true },
      { name: 'type', label: 'סוג', type: 'select', options: [{ v: 'expense', t: 'הוצאה' }, { v: 'income', t: 'הכנסה' }], value: 'expense' },
      { name: 'cat', label: 'קטגוריה', type: 'select', options: BUDGET_CATS.map((c) => ({ v: c, t: c })), value: 'אוכל' },
      { name: 'date', label: 'תאריך', type: 'date', value: todayISO(), required: true }
    ], (v) => {
      S.budget.entries.push({ id: uid('b'), desc: v.desc, amount: Number(v.amount) || 0, type: v.type, cat: v.cat, date: v.date });
      save(); toast(v.type === 'expense' ? 'ההוצאה נרשמה' : 'ההכנסה נרשמה', 'ok');
      checkAchievements(); render();
    }, 'שמירה');
  },

  /* ---------- timetable ---------- */
  timetable(box) {
    const lessons = 8;
    const colors = ['#EDE7FF', '#E3F6FF', '#FDE7F3', '#E7F2E9', '#FBF1E5', '#F3E8FF'];
    const cellFor = (d, l) => S.timetable.find((x) => x.day === d && x.lesson === l);
    let head = '<div class="cal-dow" style="text-align:center"></div>' + HEB_DOW.slice(0, 6).map((d) => '<div class="cal-dow" style="text-align:center">' + d + '</div>').join('');
    let rows = '';
    for (let l = 1; l <= lessons; l++) {
      rows += '<div class="cal-dow" style="display:flex;align-items:center;justify-content:center;font-size:11px">' + l + '</div>';
      for (let d = 0; d < 6; d++) {
        const c = cellFor(d, l);
        const isToday = new Date().getDay() === d;
        rows += '<button data-cell="' + d + '-' + l + '" style="min-height:52px;border-radius:12px;padding:5px;font-size:11.5px;font-weight:800;line-height:1.2;' +
          'background:' + (c ? c.color : 'rgba(139,92,246,.05)') + ';border:1px solid ' + (isToday ? 'var(--brand)' : 'rgba(139,92,246,.10)') + ';color:#3B3355;overflow:hidden">' +
          (c ? esc(c.subject) + (c.room ? '<div style="font-size:9.5px;font-weight:600;opacity:.7">' + esc(c.room) + '</div>' : '') : '<span style="opacity:.3">+</span>') + '</button>';
      }
    }
    box.innerHTML =
      '<div class="row" style="margin-bottom:12px"><div class="sp"><div class="h2">🕘 מערכת שעות אישית</div>' +
      '<div class="tiny">לוחצים על משבצת כדי להוסיף שיעור. שישי ושבת בחופש 😌</div></div>' +
      '<button class="btn ghost sm" id="tt-clear">ניקוי</button></div>' +
      '<div class="card tight" style="overflow-x:auto"><div style="min-width:520px;display:grid;grid-template-columns:28px repeat(6,1fr);gap:4px">' + head + rows + '</div></div>' +
      (S.timetable.length ? '<div class="section"><div class="card tight"><div class="h3" style="margin-bottom:6px">השיעורים שלך</div>' +
        '<div class="chips">' + Array.from(new Set(S.timetable.map((x) => x.subject))).map((s) => '<span class="chip mini">' + esc(s) + '</span>').join('') + '</div></div></div>' : '');

    $$('[data-cell]', box).forEach((b) => {
      b.onclick = () => {
        const [d, l] = b.dataset.cell.split('-').map(Number);
        const c = cellFor(d, l);
        openSheet({
          title: HEB_DOW[d] + ' · שיעור ' + l,
          body: '<div class="field" style="margin-bottom:10px"><label>מקצוע</label><input class="input" id="tt-sub" value="' + esc(c ? c.subject : '') + '" placeholder="מתמטיקה"></div>' +
            '<div class="field" style="margin-bottom:10px"><label>מורה / חדר</label><input class="input" id="tt-room" value="' + esc(c ? c.room : '') + '" placeholder="חדר 12"></div>' +
            '<div class="field" style="margin-bottom:14px"><label>צבע</label><div class="swatches">' +
            colors.map((col) => '<button class="sw ' + (c && c.color === col ? 'on' : '') + '" data-color="' + col + '" style="background:' + col + '"></button>').join('') + '</div></div>' +
            '<div class="row"><button class="btn block" id="tt-save">שמירה</button>' + (c ? '<button class="btn danger block" id="tt-del">הסרה</button>' : '') + '</div>',
          onMount: (root) => {
            let color = c ? c.color : colors[(d + l) % colors.length];
            $$('[data-color]', root).forEach((sb) => { sb.onclick = () => { color = sb.dataset.color; $$('[data-color]', root).forEach((x) => x.classList.toggle('on', x === sb)); }; });
            root.querySelector('#tt-save').onclick = () => {
              const subject = root.querySelector('#tt-sub').value.trim();
              const room = root.querySelector('#tt-room').value.trim();
              if (!subject) { toast('צריך שם מקצוע', 'err'); return; }
              if (c) Object.assign(c, { subject, room, color });
              else S.timetable.push({ id: uid('tt'), day: d, lesson: l, subject, room, color });
              save(); closeSheet(); toast('המערכת עודכנה', 'ok'); render();
            };
            const dl = root.querySelector('#tt-del');
            if (dl) dl.onclick = () => { S.timetable = S.timetable.filter((x) => !(x.day === d && x.lesson === l)); save(); closeSheet(); render(); toast('השיעור הוסר', 'ok'); };
          }
        });
      };
    });
    const cl = $('#tt-clear', box);
    if (cl) cl.onclick = () => confirmSheet('לנקות מערכת שעות?', 'כל השיעורים יוסרו.', () => { S.timetable = []; save(); render(); toast('נוקה', 'ok'); });
  },

  /* ---------- timers tab ---------- */
  timersTab(box) {
    box.innerHTML = '<div id="timer-slot"></div>' +
      '<div class="section"><div class="card tight"><div class="h3" style="margin-bottom:5px">למה טיימר עוזר?</div>' +
      '<div class="sub">25 דקות עבודה ממוקדת ואז 5 דקות הפסקה. המוח עובד טוב יותר בהפסקות קצובות מאשר בשעות ארוכות.</div></div></div>';
    Timers.mount($('#timer-slot', box), null);
  },

  /* ---------- countdown ---------- */
  countdown(box) {
    const items = S.countdowns.slice().sort((a, b) => a.date.localeCompare(b.date));
    const upcoming = S.events.filter((e) => daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
    box.innerHTML =
      '<div class="row" style="margin-bottom:12px"><div class="sp"><div class="h2">⏳ ספירה לאחור</div>' +
      '<div class="tiny">לאירועים שמחכים להם</div></div><button class="btn sm" id="cd-add">+ ספירה</button></div>' +
      (items.length ? '<div class="stack">' + items.map((c) => {
        const d = daysUntil(c.date);
        return '<div class="card tight" style="display:flex;align-items:center;gap:12px">' +
          '<span style="font-size:28px">' + (c.emoji || '🎉') + '</span>' +
          '<div class="sp"><div class="h3">' + esc(c.title) + '</div><div class="tiny">' + fmtLong(c.date) + '</div></div>' +
          '<div style="text-align:center"><div style="font-size:22px;font-weight:900;color:var(--brand)">' + (d < 0 ? '✓' : d) + '</div>' +
          '<div class="tiny">' + (d < 0 ? 'עבר' : d === 0 ? 'היום!' : 'ימים') + '</div></div>' +
          '<button class="del" data-del-cd="' + c.id + '">🗑</button></div>';
      }).join('') + '</div>' : '<div class="empty">עוד לא הוספת ספירה לאחור. יום הולדת? טיול? מבחן?</div>') +
      '<div class="section"><div class="section-head"><div class="h2">מה כבר ביומן</div></div>' +
      (upcoming.length ? '<div class="list-plain">' + upcoming.map((e) => '<div class="item">' +
        '<span style="font-size:17px">' + (EV_TYPES[e.type] || EV_TYPES.event).icon + '</span>' +
        '<span class="sp"><span class="item-title">' + esc(e.title) + '</span><span class="item-sub">' + fmtLong(e.date) + '</span></span>' +
        '<button class="btn ghost xs" data-add-cd="' + e.id + '">להוסיף לספירה</button></div>').join('') + '</div>'
        : '<div class="empty">אין אירועים עתידיים</div>') + '</div>';

    $('#cd-add', box).onclick = () => formSheet('ספירה לאחור חדשה', [
      { name: 'title', label: 'לאיזה אירוע?', required: true, ph: 'טיול לקפריסין' },
      { name: 'date', label: 'תאריך', type: 'date', value: iso(addDays(new Date(), 30)), required: true },
      { name: 'emoji', label: 'אימוג׳י', value: '🎉' }
    ], (v) => {
      S.countdowns.push({ id: uid('cd'), title: v.title, date: v.date, emoji: v.emoji || '🎉' });
      save(); toast('נוסף לספירה', 'ok'); render();
    }, 'הוספה');
    $$('[data-del-cd]', box).forEach((b) => { b.onclick = () => { S.countdowns = S.countdowns.filter((x) => x.id !== b.dataset.delCd); save(); render(); }; });
    $$('[data-add-cd]', box).forEach((b) => {
      b.onclick = () => {
        const e = S.events.find((x) => x.id === b.dataset.addCd);
        if (!e) return;
        if (S.countdowns.some((c) => c.title === e.title && c.date === e.date)) { toast('כבר בספירה', 'err'); return; }
        S.countdowns.push({ id: uid('cd'), title: e.title, date: e.date, emoji: (EV_TYPES[e.type] || EV_TYPES.event).icon });
        save(); toast('נוסף לספירה', 'ok'); render();
      };
    });
  },

  /* ---------- weekly summary ---------- */
  summary(box) {
    const week = weekDates();
    const inWeek = (d) => d && week.includes(d);
    const doneTasks = S.tasks.filter((t) => t.done && inWeek(t.doneAt));
    const createdTasks = S.tasks.filter((t) => inWeek(t.created));
    const events = S.events.filter((e) => inWeek(e.date));
    const spent = S.budget.entries.filter((e) => e.type === 'expense' && inWeek(e.date)).reduce((a, e) => a + Number(e.amount || 0), 0);
    const designs = S.designs.filter((d) => inWeek(iso(new Date(d.createdAt || Date.now()))));
    const hwDone = S.homework.filter((h) => h.done);
    const newAch = ACHIEVEMENTS.filter((a) => S.achievements[a.key] && inWeek(S.achievements[a.key]));
    const perDay = week.map((d) => doneTasks.filter((t) => t.doneAt === d).length);
    const maxDay = Math.max(1, ...perDay);

    box.innerHTML =
      '<div class="hero" style="background:linear-gradient(135deg,#6D4BD1,#A78BFA 55%,#7DD3FC)">' +
      '<div class="h2" style="color:#fff">השבוע שלך ב-MIXIT</div>' +
      '<div class="sub" style="margin-top:4px">' + fmtShort(week[0]) + ' – ' + fmtShort(week[6]) + ' · רצף ' + S.streak.count + ' ימים</div>' +
      '<div style="margin-top:14px;font-size:13.5px;line-height:1.6;font-weight:600">' +
      (doneTasks.length ? 'סיימת ' + doneTasks.length + ' משימות' : 'עוד לא סימנת משימות השבוע') +
      (events.length ? ', ויש ' + events.length + ' אירועים ביומן' : '') +
      (designs.length ? ', ויצרת ' + designs.length + ' עיצובים' : '') + '. ' +
      (doneTasks.length >= 5 ? 'שבוע חזק 💪' : 'כל צעד קטן נחשב ✨') + '</div></div>' +

      '<div class="grid g4" style="margin-top:14px">' +
      '<div class="stat"><b>' + doneTasks.length + '</b><span>משימות שהושלמו</span></div>' +
      '<div class="stat"><b>' + createdTasks.length + '</b><span>משימות חדשות</span></div>' +
      '<div class="stat"><b>' + events.length + '</b><span>אירועים</span></div>' +
      '<div class="stat"><b>' + spent + ' ₪</b><span>הוצאות</span></div></div>' +

      '<div class="section"><div class="card"><div class="h3" style="margin-bottom:12px">משימות לפי יום</div>' +
      '<div style="display:flex;align-items:flex-end;gap:8px;height:120px">' +
      perDay.map((v, i) => '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%">' +

/* ===== Timers ===== */
const Timers = {
  timer: { running: false, endAt: 0, remain: 25 * 60000, dur: 25 * 60000 },
  sw: { running: false, startAt: 0, elapsed: 0 },
  mode: 'timer',
  interval: null,
  root: null,

  mount(root, initialMin) {
    this.root = root;
    if (initialMin) this.setTimer(initialMin * 60000);
    this.render();
    this.startLoop();
  },
  setTimer(ms) {
    this.timer.dur = ms;
    this.timer.remain = ms;
    this.timer.running = false;
    this.timer.endAt = 0;
  },
  startLoop() {
    clearInterval(this.interval);
    this.interval = setInterval(() => this.tick(), 200);
  },
  fmt(ms) {
    ms = Math.max(0, ms);
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60), s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  },
  swFmt(ms) {
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60), s = total % 60, cs = Math.floor((ms % 1000) / 100);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + cs;
  },
  render() {
    if (!this.root) return;
    const isT = this.mode === 'timer';
    const remain = this.timer.running ? Math.max(0, this.timer.endAt - Date.now()) : this.timer.remain;
    const pct = isT ? Math.max(0, Math.min(100, 100 - (remain / this.timer.dur) * 100)) : 0;
    const swMs = this.sw.running ? this.sw.elapsed + (Date.now() - this.sw.startAt) : this.sw.elapsed;
    this.root.innerHTML =
      '<div class="card">' +
      '<div class="tabs" style="margin-bottom:16px"><button class="tab ' + (isT ? 'on' : '') + '" data-mode="timer">⏳ טיימר</button>' +
      '<button class="tab ' + (isT ? '' : 'on') + '" data-mode="sw">⏱️ סטופר</button></div>' +
      '<div style="text-align:center;position:relative;padding:10px 0 4px">' +
      '<div class="ring" style="width:190px;height:190px;margin:0 auto">' +
      '<svg width="190" height="190"><circle cx="95" cy="95" r="84" fill="none" stroke="rgba(139,92,246,.12)" stroke-width="13"/>' +
      '<circle cx="95" cy="95" r="84" fill="none" stroke="url(#tgrad)" stroke-width="13" stroke-linecap="round" stroke-dasharray="' + (2 * Math.PI * 84).toFixed(1) + '" stroke-dashoffset="' + (2 * Math.PI * 84 * (1 - (isT ? pct / 100 : 0))).toFixed(1) + '" transform="rotate(-90 95 95)"/></svg>' +
      '<defs><linearGradient id="tgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>' +
      '<span id="t-display" style="font-size:' + (isT ? 38 : 30) + 'px;font-weight:900;letter-spacing:-1px">' + (isT ? this.fmt(remain) : this.swFmt(swMs)) + '</span></div>' +
      '<div class="tiny" style="margin-top:8px">' + (isT ? (this.timer.running ? 'הטיימר רץ…' : this.timer.remain === this.timer.dur ? 'מוכן להתחלה' : 'מושהה') : (this.sw.running ? 'הסטופר רץ' : 'סטופר')) + '</div>' +
      '</div>' +
      (isT ? '<div class="chips" style="justify-content:center;margin:14px 0">' +
        [5, 15, 25, 45, 60].map((m) => '<button class="chip ' + (this.timer.dur === m * 60000 ? 'on' : '') + '" data-min="' + m + '">' + m + ' דק׳</button>').join('') + '</div>' : '') +
      '<div class="row" style="gap:8px;margin-top:6px">' +
      (isT
        ? '<button class="btn block" data-action="toggle">' + (this.timer.running ? '⏸ השהיה' : '▶ התחלה') + '</button>' +
          '<button class="btn ghost" data-action="reset">איפוס</button>'
        : '<button class="btn block" data-action="swtoggle">' + (this.sw.running ? '⏸ עצירה' : '▶ התחלה') + '</button>' +
          '<button class="btn ghost" data-action="swreset">איפוס</button>') +
      '</div></div>';

    $$('[data-mode]', this.root).forEach((b) => { b.onclick = () => { this.mode = b.dataset.mode; this.render(); }; });
    $$('[data-min]', this.root).forEach((b) => {
      b.onclick = () => { this.setTimer(Number(b.dataset.min) * 60000); this.render(); };
    });
    const act = this.root.querySelector('[data-action]');
    if (act) {
      act.onclick = () => {
        const a = act.dataset.action;
        if (a === 'toggle') {
          if (this.timer.running) {
            this.timer.remain = Math.max(0, this.timer.endAt - Date.now());
            this.timer.running = false;
          } else {
            if (this.timer.remain <= 0) this.timer.remain = this.timer.dur;
            this.timer.endAt = Date.now() + this.timer.remain;
            this.timer.running = true;
            toast('הטיימר התחיל ⏳', 'ok', 1400);
          }
          this.render();
        } else if (a === 'reset') {
          this.setTimer(this.timer.dur); this.render(); toast('אופס', 'info', 1200);
        } else if (a === 'swtoggle') {
          if (this.sw.running) { this.sw.elapsed += Date.now() - this.sw.startAt; this.sw.running = false; }
          else { this.sw.startAt = Date.now(); this.sw.running = true; }
          this.render();
        } else if (a === 'swreset') {
          this.sw = { running: false, startAt: 0, elapsed: 0 }; this.render();
        }
      };
    }
  },
  tick() {
    if (!this.root || !document.body.contains(this.root)) { this.interval && clearInterval(this.interval); this.interval = null; return; }
    const disp = this.root.querySelector('#t-display');
    if (!disp) return;
    if (this.mode === 'timer') {
      if (!this.timer.running) return;
      const remain = Math.max(0, this.timer.endAt - Date.now());
      disp.textContent = this.fmt(remain);
      if (remain <= 0) {
        this.timer.running = false;
        this.timer.remain = this.timer.dur;
        S.stats.minutes = (S.stats.minutes || 0) + Math.round(this.timer.dur / 60000);
        save(); checkAchievements();
        this.beep();
        toast('הזמן נגמר! ⏰ עשית ' + Math.round(this.timer.dur / 60000) + ' דקות', 'ok', 4000);
        this.render();
      } else {
        const pct = 100 - (remain / this.timer.dur) * 100;
        const circ = this.root.querySelector('circle[stroke-dashoffset]');
        if (circ) circ.setAttribute('stroke-dashoffset', (2 * Math.PI * 84 * (1 - pct / 100)).toFixed(1));
      }
    } else if (this.sw.running) {
      disp.textContent = this.swFmt(this.sw.elapsed + (Date.now() - this.sw.startAt));
    }
  },
  beep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      [0, 0.25, 0.5].forEach((t, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 660 + i * 220;
        g.gain.setValueAtTime(0.001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.22);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.24);
      });
      setTimeout(() => ctx.close(), 1200);
    } catch (e) { /* ignore */ }
  },
  open(minutes) {
    openSheet({
      title: 'טיימר וסטופר',
      body: '<div id="timer-sheet-slot"></div>',
      onMount: (root) => {
        this.mode = 'timer';
        if (minutes) this.setTimer(minutes * 60000);
        this.mount(root.querySelector('#timer-sheet-slot'), minutes || null);
      }
    });
  }
};

/* ===== WHAT'S NEXT: activity generator with quick filters ===== */
const Next = {
  get state() {
    UI.next = UI.next || { min: null, budget: null, people: null, moods: [], cats: [], place: null, current: null, adv: false };
    return UI.next;
  },
  all() { return ACTIVITIES.concat(S.activities.custom || []); },
  pool() {
    const st = this.state;
    return this.all().filter((a) => {
      if (st.min && a.min > st.min) return false;
      if (st.budget) {
        const order = BUDGETS.indexOf(a.budget);
        if (order < 0 || order > BUDGETS.indexOf(st.budget)) return false;
      }
      if (st.people && a.people !== st.people) return false;
      if (st.moods && st.moods.length && !(a.moods || []).some((m) => st.moods.includes(m))) return false;
      if (st.place && a.place !== st.place) return false;
      if (st.cats.length && !st.cats.includes(a.cat)) return false;
      return true;
    });
  },
  draw(silent) {
    const st = this.state;
    const pool = this.pool();
    if (!pool.length) {
      toast('אין התאמות לסינון הזה. אפשר להרחיב אותו', 'err');
      return;
    }
    let pick = pool[Math.floor(Math.random() * pool.length)];
    if (pool.length > 1 && st.current) {
      let guard = 0;
      while (pick.id === st.current && guard++ < 25) pick = pool[Math.floor(Math.random() * pool.length)];
    }
    st.current = pick.id;
    S.stats.ideas = (S.stats.ideas || 0) + 1;
    S.activities.history = (S.activities.history || []).concat([{ id: pick.id, at: new Date().toISOString() }]).slice(-60);

/* ---------- canvas drawing ---------- */
function wrapLines(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach((para) => {
    const words = para.split(' ');
    let line = '';
    words.forEach((w) => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
      else line = test;
    });
    out.push(line);
  });
  return out;
}

function drawPattern(ctx, kind, w, h, color) {
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  if (kind === 'dots') {
    for (let y = 20; y < h; y += 42) for (let x = 20; x < w; x += 42) { ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); }
  } else if (kind === 'stripes') {
    ctx.lineWidth = 8;
    for (let x = -h; x < w + h; x += 46) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + h, h); ctx.stroke(); }
  } else if (kind === 'grid') {
    ctx.lineWidth = 2;
    for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  } else if (kind === 'lines') {
    ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5;
    for (let y = 140; y < h - 40; y += 46) { ctx.beginPath(); ctx.moveTo(36, y); ctx.lineTo(w - 36, y); ctx.stroke(); }
  } else if (kind === 'hearts') {
    ctx.globalAlpha = 0.13;
    for (let y = 40; y < h; y += 90) for (let x = 40; x < w; x += 90) {
      ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.fillText('💜', x, y);
    }
  }
  ctx.restore();
}

function drawFrame(ctx, f, w, h) {
  if (!f || f.style === 'none') return;
  ctx.save();
  ctx.strokeStyle = f.color || '#fff';
  if (f.style === 'thin') { ctx.lineWidth = 3; ctx.strokeRect(18, 18, w - 36, h - 36); }
  else if (f.style === 'thick') { ctx.lineWidth = 10; ctx.strokeRect(26, 26, w - 52, h - 52); }
  else if (f.style === 'double') {
    ctx.lineWidth = 3; ctx.strokeRect(18, 18, w - 36, h - 36);
    ctx.lineWidth = 2; ctx.strokeRect(30, 30, w - 60, h - 60);
  } else if (f.style === 'dashed') {
    ctx.lineWidth = 4; ctx.setLineDash([16, 12]); ctx.strokeRect(20, 20, w - 40, h - 40); ctx.setLineDash([]);
  } else if (f.style === 'corners') {
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    const L = 54, m = 22;
    [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]].forEach(([x, y, dx, dy]) => {
      ctx.beginPath(); ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L); ctx.stroke();
    });
  }
  ctx.restore();
}

function heartPath(ctx, x, y, w, h) {
  const top = y + h * 0.3;
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y + h);
  ctx.bezierCurveTo(x - w * 0.1, y + h * 0.6, x + w * 0.08, y + h * 0.05, x + w / 2, top);
  ctx.bezierCurveTo(x + w * 0.92, y + h * 0.05, x + w * 1.1, y + h * 0.6, x + w / 2, y + h);
  ctx.closePath();
}
function starPath(ctx, x, y, w, h) {
  const cx = x + w / 2, cy = y + h / 2, R = Math.min(w, h) / 2, r = R * 0.45;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (Math.PI / 5) * i - Math.PI / 2;
    const rad = i % 2 ? r : R;
    const px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

const Studio = {
  d: null, sel: null, panel: 'style', drag: null, bounds: {}, root: null,

  draw(ctx, d) {
    const w = d.w, h = d.h;
    ctx.clearRect(0, 0, w, h);
    if (d.bg.kind === 'gradient') {
      const a = ((d.bg.angle || 135) * Math.PI) / 180;
      const x1 = w / 2 - Math.cos(a) * w / 2, y1 = h / 2 - Math.sin(a) * h / 2;
      const x2 = w / 2 + Math.cos(a) * w / 2, y2 = h / 2 + Math.sin(a) * h / 2;
      const g = ctx.createLinearGradient(x1, y1, x2, y2);
      g.addColorStop(0, d.bg.c1); g.addColorStop(1, d.bg.c2);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = d.bg.c1 || '#fff';
    }
    ctx.fillRect(0, 0, w, h);
    if (d.bg.pattern && d.bg.pattern !== 'none') drawPattern(ctx, d.bg.pattern, w, h, d.bg.c2 || '#000');
    drawFrame(ctx, d.frame, w, h);

    const b = {};
    (d.elements || []).forEach((el) => {
      ctx.save();
      if (el.type === 'text') {
        ctx.translate(el.x + el.w / 2, el.y);
        ctx.rotate(((el.rot || 0) * Math.PI) / 180);
        ctx.font = (el.weight || 700) + ' ' + el.size + 'px "' + el.font + '", "Heebo", sans-serif';
        ctx.fillStyle = el.color; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        const lines = wrapLines(ctx, el.text, el.w);
        const lh = el.size * (el.lineH || 1.22);
        lines.forEach((ln, i) => ctx.fillText(ln, 0, i * lh));
        b[el.id] = { x: el.x, y: el.y, w: el.w, h: Math.max(el.size, lines.length * lh) };
      } else if (el.type === 'emoji') {
        ctx.translate(el.x, el.y); ctx.rotate(((el.rot || 0) * Math.PI) / 180);
        ctx.font = el.size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(el.char, 0, 0);
        b[el.id] = { x: el.x - el.size / 2, y: el.y - el.size / 2, w: el.size, h: el.size };
      } else if (el.type === 'image') {
        ctx.translate(el.x + el.w / 2, el.y + el.h / 2);
        ctx.rotate(((el.rot || 0) * Math.PI) / 180);
        const r = Math.min(el.radius || 0, Math.min(el.w, el.h) / 2);
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-el.w / 2, -el.h / 2, el.w, el.h, r);
        else ctx.rect(-el.w / 2, -el.h / 2, el.w, el.h);
        ctx.save(); ctx.clip();
        const img = this.imgCache[el.src];
        if (img && img.complete && img.naturalWidth) {
          const s = Math.max(el.w / img.naturalWidth, el.h / img.naturalHeight);
          const iw = img.naturalWidth * s, ih = img.naturalHeight * s;
          ctx.drawImage(img, -iw / 2, -ih / 2, iw, ih);
        } else {
          ctx.fillStyle = '#EDE7FF'; ctx.fill();
          ctx.fillStyle = '#8B84A0'; ctx.font = '20px "Heebo",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('תמונה', 0, 0);
        }
        ctx.restore();
        b[el.id] = { x: el.x, y: el.y, w: el.w, h: el.h };
      } else if (el.type === 'shape') {
        ctx.translate(el.x + el.w / 2, el.y + el.h / 2);
        ctx.rotate(((el.rot || 0) * Math.PI) / 180);
        ctx.globalAlpha = el.opacity == null ? 1 : el.opacity;
        ctx.fillStyle = el.color; ctx.strokeStyle = el.color;
        const hw = el.w / 2, hh = el.h / 2;
        if (el.shape === 'circle') { ctx.beginPath(); ctx.ellipse(0, 0, hw, hh, 0, 0, 7); ctx.fill(); }
        else if (el.shape === 'rect') { ctx.fillRect(-hw, -hh, el.w, el.h); }
        else if (el.shape === 'line') { ctx.fillRect(-hw, -3, el.w, 6); }
        else if (el.shape === 'heart') { heartPath(ctx, -hw, -hh, el.w, el.h); ctx.fill(); }
        else if (el.shape === 'star') { starPath(ctx, -hw, -hh, el.w, el.h); ctx.fill(); }
        else if (el.shape === 'triangle') { ctx.beginPath(); ctx.moveTo(0, -hh); ctx.lineTo(hw, hh); ctx.lineTo(-hw, hh); ctx.closePath(); ctx.fill(); }
        b[el.id] = { x: el.x, y: el.y, w: el.w, h: el.h };
      }
      ctx.restore();
    });
    this.bounds = b;
  },

  imgCache: {},

  loadImages(d) {
    (d.elements || []).forEach((el) => {
      if (el.type === 'image' && el.src && !this.imgCache[el.src]) {
        const img = new Image();
        img.onload = () => this.paint();
        img.src = el.src;
        this.imgCache[el.src] = img;
      }
    });
  },

  paint() {
    const c = document.getElementById('stage');
    if (!c || !this.d) return;
    const ctx = c.getContext('2d');
    this.draw(ctx, this.d);
    if (this.sel) {
      const bb = this.bounds[this.sel];
      if (bb) {
        ctx.save();
        ctx.strokeStyle = '#8B5CF6'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
        ctx.strokeRect(bb.x - 4, bb.y - 4, bb.w + 8, bb.h + 8);
        ctx.setLineDash([]);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#8B5CF6';
        [[bb.x - 4, bb.y - 4], [bb.x + bb.w + 4, bb.y - 4], [bb.x - 4, bb.y + bb.h + 4], [bb.x + bb.w + 4, bb.y + bb.h + 4]].forEach(([x, y]) => {
          ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); ctx.stroke();
        });
        ctx.restore();
      }
    }
  },

  bindCanvas(c) {
    const self = this;
    const toLocal = (e) => {
      const r = c.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (self.d.w / r.width), y: (e.clientY - r.top) * (self.d.h / r.height) };
    };
    const hit = (p) => {
      const els = self.d.elements || [];
      for (let i = els.length - 1; i >= 0; i--) {
        const bb = self.bounds[els[i].id];
        if (bb && p.x >= bb.x - 6 && p.x <= bb.x + bb.w + 6 && p.y >= bb.y - 6 && p.y <= bb.y + bb.h + 6) return els[i];
      }
      return null;
    };
    c.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      c.setPointerCapture(e.pointerId);
      const p = toLocal(e);
      const el = hit(p);
      self.sel = el ? el.id : null;
      if (el) {
        self.drag = { id: el.id, dx: p.x - el.x, dy: p.y - el.y, moved: false };
        if (self.panel !== 'layer') self.panel = 'layer';
        self.renderPanel();
      } else {
        self.drag = null;
        self.renderPanel();
      }
      c.classList.add('dragging');
      self.paint();
    });
    c.addEventListener('pointermove', (e) => {
      if (!self.drag) return;
      const p = toLocal(e);
      const el = (self.d.elements || []).find((x) => x.id === self.drag.id);
      if (!el) return;
      el.x = Math.round(p.x - self.drag.dx);
      el.y = Math.round(p.y - self.drag.dy);
      self.drag.moved = true;
      self.paint();
    });
    const end = () => {
      if (self.drag && self.drag.moved) { self.d.updatedAt = Date.now(); save(); }
      self.drag = null;
      c.classList.remove('dragging');
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('pointerleave', end);
  },

        '<div class="h3" style="margin-bottom:8px">עיצוב חדש מאותו סוג</div>' +
        '<button class="btn ghost sm" data-new-type>צור עיצוב חדש</button>';
    }
    p.innerHTML = html;
    this.bindPanel(p);
  },

  bindPanel(p) {
    const d = this.d, self = this;
    const el = this.selEl();
    const repaint = () => { d.updatedAt = Date.now(); this.paint(); save(); };

    $$('[data-bgkind]', p).forEach((b) => { b.onclick = () => { d.bg.kind = b.dataset.bgkind; repaint(); this.renderPanel(); }; });
    const c1 = p.querySelector('[data-bgc1]'); if (c1) c1.oninput = () => { d.bg.c1 = c1.value; repaint(); };
    const c2 = p.querySelector('[data-bgc2]'); if (c2) c2.oninput = () => { d.bg.c2 = c2.value; repaint(); };
    const ang = p.querySelector('[data-bgangle]'); if (ang) ang.oninput = () => { d.bg.angle = Number(ang.value); repaint(); };
    const pat = p.querySelector('[data-pattern]'); if (pat) pat.onchange = () => { d.bg.pattern = pat.value; repaint(); };
    $$('[data-pal]', p).forEach((b) => {
      b.onclick = () => {
        const cs = COLOR_SETS[Number(b.dataset.pal)];
        d.bg.kind = 'gradient'; d.bg.c1 = cs.colors[0]; d.bg.c2 = cs.colors[1];
        repaint(); this.renderPanel(); toast('הפלטה הוחלה', 'ok', 1500);
      };
    });
    $$('[data-frame]', p).forEach((b) => { b.onclick = () => { d.frame.style = b.dataset.frame; repaint(); this.renderPanel(); }; });
    const fc = p.querySelector('[data-framecolor]'); if (fc) fc.oninput = () => { d.frame.color = fc.value; repaint(); };

    $$('[data-add]', p).forEach((b) => {
      b.onclick = () => {
        const kind = b.dataset.add;
        if (kind === 'text') {
          d.elements.push(mkText('טקסט חדש', { x: d.w * 0.1, y: d.h * 0.45, w: d.w * 0.8, size: Math.round(d.w * 0.06), color: '#2C2540' }));
        } else if (kind === 'headline') {
          d.elements.push(mkText('כותרת', { x: d.w * 0.08, y: d.h * 0.2, w: d.w * 0.84, size: Math.round(d.w * 0.11), weight: 900, color: '#8B5CF6' }));
        } else if (kind === 'image') {
          pickImage((src) => {
            d.elements.push(mkImage(src, { x: d.w * 0.12, y: d.h * 0.3, w: d.w * 0.76, h: d.w * 0.6 }));
            this.loadImages(d); repaint(); this.sel = d.elements[d.elements.length - 1].id; this.panel = 'layer'; this.renderPanel(); this.paint();
            toast('התמונה נוספה', 'ok');
          }, 1200);
          return;
        } else if (kind === 'shape') {
          d.elements.push(mkShape('circle', { x: d.w * 0.3, y: d.h * 0.35, w: d.w * 0.4, h: d.w * 0.4, color: '#C4B5FD' }));
        }
        this.sel = d.elements[d.elements.length - 1].id;
        this.panel = 'layer'; repaint(); this.renderPanel();
      };
    });
    $$('[data-emoji]', p).forEach((b) => {
      b.onclick = () => {
        d.elements.push(mkEmoji(b.dataset.emoji, { x: d.w / 2, y: d.h / 2, size: Math.round(d.w * 0.2) }));
        this.sel = d.elements[d.elements.length - 1].id;
        this.panel = 'layer'; repaint(); this.renderPanel();
      };
    });
    $$('[data-shape]', p).forEach((b) => {
      b.onclick = () => {
        d.elements.push(mkShape(b.dataset.shape, { x: d.w * 0.3, y: d.h * 0.35, w: d.w * 0.4, h: d.w * 0.4, color: '#C4B5FD' }));
        this.sel = d.elements[d.elements.length - 1].id;
        this.panel = 'layer'; repaint(); this.renderPanel();
      };
    });
    $$('[data-pick]', p).forEach((b) => { b.onclick = () => { this.sel = b.dataset.pick; repaint(); this.renderPanel(); }; });
    $$('[data-del-el]', p).forEach((b) => {
      b.onclick = () => {
        d.elements = d.elements.filter((x) => x.id !== b.dataset.delEl);
        if (this.sel === b.dataset.delEl) this.sel = null;
        repaint(); this.renderPanel(); toast('האלמנט נמחק', 'ok', 1400);
      };
    });
    const dup = p.querySelector('[data-dup]');
    if (dup && el) dup.onclick = () => {
      const copy = JSON.parse(JSON.stringify(el));
      copy.id = uid('el'); copy.x += 22; copy.y += 22;
      d.elements.push(copy); this.sel = copy.id; repaint(); this.renderPanel();
    };
    const t = p.querySelector('#el-text');
    if (t && el) t.oninput = () => { el.text = t.value; repaint(); };
    const f = p.querySelector('#el-font');
    if (f && el) f.onchange = () => { el.font = f.value; repaint(); };
    const wt = p.querySelector('#el-weight');
    if (wt && el) wt.onchange = () => { el.weight = Number(wt.value); repaint(); };
    const sz = p.querySelector('[data-size]');
    if (sz && el) sz.oninput = () => { el.size = Number(sz.value); repaint(); };
    const wd = p.querySelector('[data-width]');
    if (wd && el) wd.oninput = () => { el.w = Number(wd.value); repaint(); };
    const ht = p.querySelector('[data-height]');
    if (ht && el) ht.oninput = () => { el.h = Number(ht.value); repaint(); };
    const rd = p.querySelector('[data-radius]');
    if (rd && el) rd.oninput = () => { el.radius = Number(rd.value); repaint(); };
    const op = p.querySelector('[data-opacity]');
    if (op && el) op.oninput = () => { el.opacity = Number(op.value) / 100; repaint(); };
    const rot = p.querySelector('[data-rot]');
    if (rot && el) rot.oninput = () => { el.rot = Number(rot.value); repaint(); };
    const ec = p.querySelector('[data-elcolor]');
    if (ec && el) ec.oninput = () => { el.color = ec.value; repaint(); };
    $$('[data-elcolor-set]', p).forEach((b) => { if (el) b.onclick = () => { el.color = b.dataset.elcolorSet; repaint(); this.renderPanel(); }; });
    $$('[data-align]', p).forEach((b) => { if (el) b.onclick = () => { el.align = b.dataset.align; repaint(); this.renderPanel(); }; });
    $$('[data-emoji-sel]', p).forEach((b) => { if (el) b.onclick = () => { el.char = b.dataset.emojiSel; repaint(); this.renderPanel(); }; });
    $$('[data-shapesel]', p).forEach((b) => { if (el) b.onclick = () => { el.shape = b.dataset.shapesel; repaint(); this.renderPanel(); }; });
    const rep = p.querySelector('[data-replace]');
    if (rep && el) rep.onclick = () => pickImage((src) => { el.src = src; this.loadImages(d); repaint(); }, 1200);
    const fit = p.querySelector('[data-fit]');
    if (fit && el) fit.onclick = () => { el.w = d.w * 0.8; el.h = el.h * (el.w / (el.w || 1)); el.x = d.w * 0.1; repaint(); this.renderPanel(); };
    $$('[data-move]', p).forEach((b) => {
      if (!el) return;
      b.onclick = () => {
        const arr = d.elements;
        const i = arr.findIndex((x) => x.id === el.id);
        if (b.dataset.move === 'up' && i < arr.length - 1) { arr.splice(i, 1); arr.splice(i + 1, 0, el); }
        if (b.dataset.move === 'down' && i > 0) { arr.splice(i, 1); arr.splice(i - 1, 0, el); }
        if (b.dataset.move === 'center') { el.x = Math.round((d.w - (el.w || el.size || 0)) / 2); }
        repaint(); this.renderPanel();
      };
    });
    $$('[data-variant]', p).forEach((b) => {
      b.onclick = () => {
        const pals = TYPE_PALETTES[d.type] || TYPE_PALETTES.poster;
        const pal = pals[Number(b.dataset.variant)];
        d.bg.kind = 'gradient'; d.bg.c1 = pal[0]; d.bg.c2 = pal[1];
        repaint(); toast('הצבעים הוחלפו', 'ok', 1500);
      };
    });
    const rl = p.querySelector('[data-relayout]');
    if (rl) rl.onclick = () => { d.elements = layoutFor(d.type, d.w, d.h); this.sel = null; repaint(); this.renderPanel(); toast('הפריסה חודשה', 'ok'); };
    const ce = p.querySelector('[data-clear-els]');
    if (ce) ce.onclick = () => { d.elements = []; this.sel = null; repaint(); this.renderPanel(); };
    const nt = p.querySelector('[data-new-type]');
    if (nt) nt.onclick = () => this.openNew(d.type, Math.floor(Math.random() * 4));
  },

  commit() {
    const d = this.d;
    if (!d) return;
    d.thumb = this.thumb();
    d.updatedAt = Date.now();
    const i = S.designs.findIndex((x) => x.id === d.id);
    if (i < 0) S.designs.unshift(d);
    save(true);
  },
  thumb() {
    try {
      const d = this.d;
      const c = document.createElement('canvas');
      const W = 300, H = Math.round((300 * d.h) / d.w);
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.scale(W / d.w, H / d.h);
      this.draw(ctx, d);
      return c.toDataURL('image/jpeg', 0.72);
    } catch (e) { return null; }
  },
  exportCanvas(scale) {
    const d = this.d;
    const c = document.createElement('canvas');
    c.width = Math.round(d.w * (scale || 2));
    c.height = Math.round(d.h * (scale || 2));
    const ctx = c.getContext('2d');
    ctx.scale(scale || 2, scale || 2);
    this.draw(ctx, d);
    return c;
  },
  download() {
    try {
      const c = this.exportCanvas(2);
      const url = c.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mixit-' + (this.d.title || 'design').replace(/[^\w\u0590-\u05FF\- ]/g, '') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      toast('הקובץ יורד עכשיו ⬇️', 'ok');
    } catch (e) { toast('לא הצלחתי להוריד את התמונה', 'err'); }
  },
  async share() {
    try {
      const c = this.exportCanvas(2);
      const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
      const file = new File([blob], 'mixit-design.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: this.d.title, text: 'נוצר ב-MIXIT 🎨' });
        toast('נשלח לשיתוף', 'ok');
      } else {
        this.download();
        toast('הדפדפן לא תומך בשיתוף ישיר — הורדנו את התמונה', 'info', 3800);
      }
    } catch (e) { this.download(); }
  }
};

  collage() {
    openSheet({
      title: 'קולאז׳ תמונות',
      body: '<p class="sub" style="margin-bottom:12px">בוחרים 2 עד 9 תמונות, ואנחנו מסדרים אותן בעיצוב שאפשר לערוך.</p>' +
        '<button class="btn block" id="col-pick">🖼️ בחירת תמונות</button>' +
        '<div class="field" style="margin-top:14px"><label>פריסה</label><select class="input" id="col-layout">' +
        '<option value="grid">רשת מסודרת</option><option value="hero">תמונה גדולה + קטנות</option><option value="strip">רצועה אופקית</option></select></div>',
      onMount: (root) => {
        root.querySelector('#col-pick').onclick = () => {
          pickImages((imgs) => {
            const layout = root.querySelector('#col-layout').value;
            closeSheet();
            this.makeCollage(imgs, layout);
          }, 1000);
        };
      }
    });
  },
  makeCollage(imgs, layout) {
    const d = newDesign('collage', 0);
    d.bg = { kind: 'solid', c1: '#FFFFFF', c2: '#FFFFFF', angle: 0, pattern: 'none' };
    d.elements = [];
    const pad = 24, W = d.w, H = d.h;
    const n = imgs.length;
    if (layout === 'strip' && n >= 2) {
      const gap = 12, cw = (W - pad * 2 - gap * (n - 1)) / n;
      imgs.forEach((src, i) => d.elements.push(mkImage(src, { x: pad + i * (cw + gap), y: H * 0.2, w: cw, h: H * 0.6, radius: 14 })));
    } else if (layout === 'hero' && n >= 2) {
      d.elements.push(mkImage(imgs[0], { x: pad, y: pad, w: W - pad * 2, h: H * 0.52, radius: 20 }));
      const rest = imgs.slice(1, 5);
      const gap = 12, cw = (W - pad * 2 - gap * (rest.length - 1)) / rest.length;
      rest.forEach((src, i) => d.elements.push(mkImage(src, { x: pad + i * (cw + gap), y: H * 0.52 + pad + 12, w: cw, h: H * 0.38, radius: 14 })));
    } else {
      const cols = Math.ceil(Math.sqrt(n));
      const rows = Math.ceil(n / cols);
      const gap = 12;
      const cw = (W - pad * 2 - gap * (cols - 1)) / cols;
      const ch = (H - pad * 2 - gap * (rows - 1)) / rows;
      imgs.forEach((src, i) => {
        const c = i % cols, r = Math.floor(i / cols);
        d.elements.push(mkImage(src, { x: pad + c * (cw + gap), y: pad + r * (ch + gap), w: cw, h: ch, radius: 16 }));
      });
    }
    S.designs.unshift(d);
    S.stats.designs = (S.stats.designs || 0) + 1;
    save(); checkAchievements();
    Studio.open(d.id);
    toast('הקולאז׳ נוצר! אפשר לגרור ולסדר', 'ok', 3000);
  },
  sticker() {
    openSheet({
      title: 'מדבקה אישית',
      body: '<div class="field" style="margin-bottom:10px"><label>מה יהיה על המדבקה?</label><input class="input" id="stk-text" value="שלי" placeholder="מילה או שם"></div>' +
        '<div class="field" style="margin-bottom:14px"><label>אימוג׳י</label><div class="emoji-grid">' + EMOJI_PACK.map((e) => '<button data-stk-emoji="' + e + '">' + e + '</button>').join('') + '</div></div>' +
        '<button class="btn block" id="stk-create">יצירת מדבקה</button>',
      onMount: (root) => {
        let chosen = '💜';
        $$('[data-stk-emoji]', root).forEach((b) => {
          b.onclick = () => { chosen = b.dataset.stkEmoji; $$('[data-stk-emoji]', root).forEach((x) => x.style.background = x === b ? 'var(--brand-soft)' : ''); };
        });
        root.querySelector('#stk-create').onclick = () => {
          const text = root.querySelector('#stk-text').value.trim() || 'שלי';
          const d = newDesign('sticker', 0);
          d.bg = { kind: 'solid', c1: '#FFFFFF', c2: '#FFFFFF', angle: 0, pattern: 'none' };
          d.elements = [
            mkShape('circle', { x: 60, y: 60, w: 380, h: 380, color: '#EDE7FF' }),
            mkShape('circle', { x: 84, y: 84, w: 332, h: 332, color: '#FFFFFF', opacity: 1 }),
            mkEmoji(chosen, { x: 250, y: 195, size: 130 }),
            mkText(text, { x: 80, y: 320, w: 340, size: 54, weight: 900, color: '#8B5CF6' })
          ];
          S.designs.unshift(d);
          S.stats.designs = (S.stats.designs || 0) + 1;
          save(); checkAchievements(); closeSheet(); Studio.open(d.id);
          toast('המדבקה נוצרה 🏷️', 'ok');
        };
      }
    });
  }
};
