<meta property="og:description" content="ארגון, רעיונות וסטודיו יצירה — שלושה עולמות באפליקציה אחת.">

<style>
/* ===== MIXIT design system ===== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --brand:#8B5CF6;
  --brand-2:#A78BFA;
  --brand-soft:#EDE7FF;
  --accent:#7DD3FC;
  --accent-soft:#E3F6FF;
  --pink:#F9A8D4;
  --pink-soft:#FDE7F3;
  --sage:#8FB89A;
  --sage-soft:#E7F2E9;
  --beige:#F3E7D9;
  --beige-soft:#FBF4EC;
  --ink:#2C2540;
  --ink-2:#5B5470;
  --ink-3:#8B84A0;
  --line:rgba(139,92,246,.14);
  --card:#FFFFFF;
  --bg-1:#FBF8FF;
  --bg-2:#F1F7FF;
  --bg-3:#FFF7FB;
  --shadow-s:0 4px 14px rgba(89,66,150,.07);
  --shadow-m:0 10px 30px rgba(89,66,150,.10);
  --shadow-l:0 20px 50px rgba(89,66,150,.16);
  --r-xl:28px;
  --r-l:22px;
  --r-m:16px;
  --r-s:12px;
  --nav-h:74px;
  --max:1120px;
}
html,body{margin:0;padding:0}
body{
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(167,139,250,.30), transparent 62%),
    radial-gradient(760px 460px at -8% 8%, rgba(125,211,252,.28), transparent 60%),
    radial-gradient(700px 500px at 50% 108%, rgba(249,168,212,.24), transparent 62%),
    linear-gradient(160deg,var(--bg-1),var(--bg-2) 52%,var(--bg-3));
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body[data-bg="plain"]{background:linear-gradient(180deg,var(--bg-1),var(--bg-2))}
body[data-bg="warm"]{background:radial-gradient(800px 500px at 90% 0%,rgba(243,231,217,.9),transparent 60%),linear-gradient(160deg,#FFFBF6,#FBF1E7)}
body[data-bg="sage"]{background:radial-gradient(820px 520px at 10% 0%,rgba(143,184,154,.28),transparent 60%),linear-gradient(160deg,#F8FCF8,#EFF7F0)}
body[data-bg="night"]{background:radial-gradient(800px 500px at 80% -10%,rgba(139,92,246,.5),transparent 60%),linear-gradient(160deg,#241F3A,#171326);color:#F4F1FF}
body[data-bg="night"]{--ink:#F5F2FF;--ink-2:#C9C2E4;--ink-3:#A79FC4;--card:rgba(40,34,62,.92);--line:rgba(167,139,250,.28);--shadow-s:0 4px 16px rgba(0,0,0,.3);--shadow-m:0 12px 32px rgba(0,0,0,.36)}
body[data-bg="night"] .card,body[data-bg="night"] .sheet{background:var(--card)}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--brand);text-decoration:none}
::selection{background:var(--brand-soft)}
img{max-width:100%}

/* ===== layout ===== */
.shell{max-width:var(--max);margin:0 auto;padding:0 16px calc(var(--nav-h) + 26px)}
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:linear-gradient(180deg,rgba(251,248,255,.92),rgba(251,248,255,.62));
  border-bottom:1px solid rgba(139,92,246,.08);
}
body[data-bg="night"] .topbar{background:linear-gradient(180deg,rgba(30,25,48,.94),rgba(30,25,48,.7))}
.topbar-in{max-width:var(--max);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.4px}
.brand-mark{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(140deg,var(--brand),var(--accent));color:#fff;
  box-shadow:0 8px 18px rgba(139,92,246,.35);flex:none;
}
.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.4px}
.topbar-sp{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;
  background:var(--card);box-shadow:var(--shadow-s);border:1px solid var(--line);transition:.18s;
}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-m)}
.icon-btn:active{transform:scale(.94)}
.view{animation:fadeUp .32s ease both;padding-top:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== typography ===== */
.h1{font-size:26px;font-weight:900;letter-spacing:-.7px;line-height:1.2}
.h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.h3{font-size:15.5px;font-weight:800}
.sub{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.muted{color:var(--ink-3);font-size:12.5px}
.tiny{font-size:11.5px;color:var(--ink-3)}

/* ===== cards ===== */
.card{
  background:var(--card);border-radius:var(--r-l);padding:18px;
  box-shadow:var(--shadow-m);border:1px solid var(--line);position:relative;
}
.card.tight{padding:14px}
.card.flat{box-shadow:var(--shadow-s)}
.section{margin-top:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.section-head .h2{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}

/* ===== buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:15px;font-weight:800;font-size:14.5px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  box-shadow:0 8px 20px rgba(139,92,246,.28);transition:.16s;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(139,92,246,.34)}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:12px}
.btn.xs{padding:6px 11px;font-size:12px;border-radius:10px;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.btn.soft{background:var(--brand-soft);color:#5B3FBF;box-shadow:none}
.btn.pink{background:linear-gradient(135deg,#F472B6,#F9A8D4);box-shadow:0 8px 20px rgba(244,114,182,.3)}
.btn.sage{background:linear-gradient(135deg,#6FA37D,#A7C4A0);box-shadow:0 8px 20px rgba(111,163,125,.3)}
.btn.sky{background:linear-gradient(135deg,#38BDF8,#7DD3FC);box-shadow:0 8px 20px rgba(56,189,248,.3);color:#083344}
.btn.danger{background:#FDECEF;color:#C2334D;box-shadow:none}
.btn.ghost.on{background:var(--brand-soft);color:#5B3FBF;border-color:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ===== inputs ===== */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2);padding-inline-start:4px}
.input,textarea.input,select.input{
  width:100%;padding:12px 14px;border-radius:14px;background:#FBF9FF;
  border:1.5px solid rgba(139,92,246,.18);outline:none;transition:.16s;font-size:15px;
}
body[data-bg="night"] .input,body[data-bg="night"] textarea.input,body[data-bg="night"] select.input{background:rgba(255,255,255,.06)}
.input:focus,textarea.input:focus,select.input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(139,92,246,.10)}
body[data-bg="night"] .input:focus{background:rgba(255,255,255,.1)}
textarea.input{resize:vertical;min-height:76px;line-height:1.5}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
[dir="rtl"] select.input{background-position:18px 20px,23px 20px}
input[type="range"]{width:100%;accent-color:var(--brand);height:26px}
input[type="color"]{width:44px;height:38px;padding:2px;border-radius:11px;border:1.5px solid var(--line);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink-2);transition:.15s;
}
.chip:hover{border-color:var(--brand-2)}
.chip.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(139,92,246,.26)}
.chip.mini{padding:5px 10px;font-size:11.5px}

/* ===== tabs ===== */
.tabs{
  display:flex;gap:4px;padding:5px;border-radius:16px;background:rgba(139,92,246,.07);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1;min-width:max-content;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:800;color:var(--ink-2);transition:.16s;
}
.tab.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow-s)}

/* ===== lists ===== */
.item{
  display:flex;align-items:flex-start;gap:11px;padding:12px;border-radius:var(--r-m);
  background:#fff;border:1px solid rgba(139,92,246,.10);transition:.15s;
}
body[data-bg="night"] .item{background:rgba(255,255,255,.045)}
.item:hover{box-shadow:var(--shadow-s)}
.item.done{opacity:.55}
.item.done .item-title{text-decoration:line-through}
.item-title{font-weight:700;font-size:14.5px;line-height:1.35}
.item-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.check{
  width:23px;height:23px;border-radius:8px;border:2px solid var(--brand-2);flex:none;
  display:grid;place-items:center;font-size:12px;color:#fff;transition:.16s;margin-top:1px;
}
.check.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent}
.check:active{transform:scale(.9)}
.del{color:#C2334D;font-size:16px;opacity:.55;padding:2px 4px;border-radius:8px}
.del:hover{opacity:1;background:#FDECEF}
.empty{
  text-align:center;padding:26px 14px;color:var(--ink-3);font-size:13.5px;
  border:1.5px dashed rgba(139,92,246,.22);border-radius:var(--r-l);background:rgba(255,255,255,.4);
}
body[data-bg="night"] .empty{background:rgba(255,255,255,.03)}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  font-size:11px;font-weight:800;background:var(--brand-soft);color:#5B3FBF;
}
.badge.pink{background:var(--pink-soft);color:#BE185D}
.badge.sky{background:var(--accent-soft);color:#0369A1}
.badge.sage{background:var(--sage-soft);color:#3F6B4C}
.badge.beige{background:var(--beige-soft);color:#8A6A46}
.badge.red{background:#FDECEF;color:#C2334D}

/* ===== progress ===== */
.bar{height:9px;border-radius:999px;background:rgba(139,92,246,.12);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .5s ease}
.bar.pink > i{background:linear-gradient(90deg,#F472B6,#FBCFE8)}
.bar.sage > i{background:linear-gradient(90deg,#6FA37D,#B7D3BC)}

/* ===== bottom nav ===== */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(139,92,246,.12);
  display:flex;justify-content:space-around;gap:2px;
}
body[data-bg="night"] .nav{background:rgba(28,23,46,.92)}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:14px;
  font-size:10.5px;font-weight:800;color:var(--ink-3);transition:.18s;position:relative;
}
.nav button i{font-style:normal;font-size:20px;line-height:1;transition:.18s}
.nav button.on{color:var(--brand);background:var(--brand-soft)}
.nav button.on i{transform:translateY(-2px) scale(1.08)}
.nav .dot{position:absolute;top:4px;inset-inline-end:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:#F472B6;border:2px solid #fff}

/* ===== modal / sheet ===== */
.backdrop{
  position:fixed;inset:0;z-index:80;background:rgba(44,37,64,.42);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .2s both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:560px;background:var(--card);border-radius:26px 26px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  animation:slideUp .28s cubic-bezier(.22,1,.36,1) both;box-shadow:var(--shadow-l);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sheet-grab{width:44px;height:4px;border-radius:99px;background:rgba(139,92,246,.22);margin:0 auto 12px}
@media(min-width:700px){
  .backdrop{align-items:center;padding:20px}
  .sheet{border-radius:26px;max-height:88vh}
}

/* ===== toast ===== */
.toasts{position:fixed;bottom:calc(var(--nav-h) + 16px);left:0;right:0;z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{
  pointer-events:auto;max-width:420px;width:100%;padding:12px 16px;border-radius:16px;
  background:rgba(44,37,64,.95);color:#fff;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-l);
  animation:toastIn .3s cubic-bezier(.22,1,.36,1) both;
}
.toast.ok{background:linear-gradient(135deg,#5FA671,#8FB89A)}
.toast.err{background:linear-gradient(135deg,#D9536B,#F08CA0)}
.toast.info{background:linear-gradient(135deg,#6D4BD1,#A78BFA)}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(10px);opacity:0}}

/* ===== calendar ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;font-weight:800;color:var(--ink-3);padding:4px 0}
.cal-day{
  aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;position:relative;transition:.14s;background:transparent;color:var(--ink);
}
.cal-day:hover{background:var(--brand-soft)}
.cal-day.out{color:var(--ink-3);opacity:.45}
.cal-day.today{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 6px 16px rgba(139,92,246,.3)}
.cal-day.sel{outline:2.5px solid var(--brand);outline-offset:-2.5px}
.cal-day .dots{display:flex;gap:2px;margin-top:2px;height:5px}
.cal-day .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal-day.today .dots i{background:#fff !important}

/* ===== misc ===== */
.hero{
  border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#8B5CF6,#A78BFA 48%,#7DD3FC);
  box-shadow:0 18px 40px rgba(139,92,246,.3);
}
.hero::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.16);top:-90px;inset-inline-start:-50px;
}
.hero::before{
  content:"";position:absolute;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.12);bottom:-70px;inset-inline-end:-30px;
}
.hero > *{position:relative;z-index:1}
.hero .sub{color:rgba(255,255,255,.9)}
.stat{padding:14px;border-radius:var(--r-m);background:var(--card);box-shadow:var(--shadow-s);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:21px;font-weight:900;letter-spacing:-.5px;color:var(--brand)}
.stat span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.tile{
  display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:15px;border-radius:var(--r-l);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s);transition:.18s;text-align:start;
}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}
.tile i{font-style:normal;font-size:22px}
.tile b{font-size:14px;font-weight:800}
.tile span{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.fab{
  position:fixed;bottom:calc(var(--nav-h) + 18px);inset-inline-end:18px;z-index:55;
  width:56px;height:56px;border-radius:20px;display:grid;place-items:center;font-size:25px;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 14px 30px rgba(139,92,246,.42);
  transition:.18s;
}
.fab:active{transform:scale(.93)}
.fab:hover{transform:translateY(-2px)}
.list-plain{display:flex;flex-direction:column;gap:8px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(139,92,246,.16);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:800}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:11px;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.07);transition:.15s}
.sw:hover{transform:scale(1.1)}
.sw.on{outline:3px solid var(--brand);outline-offset:2px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:190px;overflow-y:auto;padding:4px}
.emoji-grid button{font-size:20px;padding:6px 0;border-radius:10px;transition:.12s}
.emoji-grid button:hover{background:var(--brand-soft)}
.avatar{
  width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(140deg,var(--brand-soft),var(--accent-soft));border:1px solid var(--line);flex:none;
}
.avatar.lg{width:74px;height:74px;border-radius:24px;font-size:36px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.scroll-x{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

<script>
/* ===== core.js ===== */
/* ===== MIXIT core: state, storage, router, ui helpers ===== */
const DB_KEY = 'mixit.v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = (p) => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function defaultState() {
  return {
    v: 1,
    user: null,
    seenIntro: false,
    theme: { preset: 'lavender', brand: '#8B5CF6', brand2: '#A78BFA', bg: 'aurora' },
    prefs: {
      homeSections: ['hero', 'quick', 'today', 'idea', 'stats', 'ach'],
      iconSet: 'soft',
      notify: false,
      weekStart: 0
    },
    events: [], tasks: [], homework: [], goals: [], shopping: [], wishes: [],
    budget: { limit: 0, entries: [] },
    timetable: [], countdowns: [],
    activities: { favorites: [], custom: [], history: [] },
    designs: [], folders: [], notes: [],
    achievements: {}, stats: { tasksDone: 0, designs: 0, ideas: 0, minutes: 0, areas: {}, days: [] },
    streak: { last: null, count: 0 },
    daily: { date: null, ideaId: null, challengeDone: false },
    introSeenAt: null
  };
}

let S = defaultState();
const UI = { screen: 'home', tab: {}, cal: {}, studio: null, searchOpen: false };

function deepMerge(base, extra) {
  if (Array.isArray(base)) return Array.isArray(extra) ? extra : base;
  if (base && typeof base === 'object') {
    const out = Object.assign({}, base);
    if (extra && typeof extra === 'object') {
      for (const k in extra) out[k] = k in base ? deepMerge(base[k], extra[k]) : extra[k];
    }
    return out;
  }
  return extra === undefined ? base : extra;
}

function load() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return deepMerge(defaultState(), parsed);
  } catch (e) {
    console.warn('load failed', e);
    return defaultState();
  }
}

let saveTimer = null;
function save(immediate) {
  const write = () => {
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(S));
    } catch (e) {
      console.warn('save failed', e);
      toast('שמירה נכשלה: אין מקום באחסון הדפדפן. נסו למחוק עיצובים ישנים.', 'err', 6000);
    }
  };
  clearTimeout(saveTimer);
  if (immediate) write();
  else saveTimer = setTimeout(write, 220);
}

/* ---------- dates ---------- */
const HEB_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const HEB_DOW = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const HEB_DOW_S = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];

function iso(d) {
  const x = d instanceof Date ? d : new Date(d);
  const p = (n) => String(n).padStart(2, '0');
  return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate());
}
function todayISO() { return iso(new Date()); }
function parseISO(s) {
  if (!s) return new Date(NaN);
  const [y, m, d] = String(s).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtShort(s) { const d = parseISO(s); return d.getDate() + '.' + (d.getMonth() + 1); }
function fmtLong(s) { const d = parseISO(s); return d.getDate() + ' ב' + HEB_MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtNice(s) {
  const d = parseISO(s), t = new Date();
  const diff = Math.round((parseISO(todayISO()) - parseISO(s)) / 86400000);
  if (diff === 0) return 'היום';
  if (diff === 1) return 'אתמול';
  if (diff === -1) return 'מחר';
  if (diff === -2) return 'מחרתיים';
  if (diff > 1) return 'לפני ' + diff + ' ימים';
  if (diff < -1 && diff > -7) return 'בעוד ' + (-diff) + ' ימים';
  return fmtShort(s);
}
function daysUntil(s) { return Math.round((parseISO(s) - parseISO(todayISO())) / 86400000); }
function weekDates(startISO) {
  const base = startISO ? parseISO(startISO) : new Date();
  const start = addDays(base, -((base.getDay() - 0 + 7) % 7));
  return Array.from({ length: 7 }, (_, i) => iso(addDays(start, i)));
}
function isSameWeek(isoStr) {
  const d = parseISO(isoStr); const now = new Date();
  const a = addDays(now, -((now.getDay()) % 7));
  return d >= parseISO(iso(a)) && d < addDays(parseISO(iso(a)), 7);
}
function dayIndex(i) { return HEB_DOW[i % 7]; }

/* ---------- theme ---------- */
const THEME_PRESETS = {
  lavender: { brand: '#8B5CF6', brand2: '#A78BFA', soft: '#EDE7FF', name: 'סגול לבנדר' },
  sky: { brand: '#38BDF8', brand2: '#7DD3FC', soft: '#E3F6FF', name: 'תכלת בהיר' },
  pink: { brand: '#F472B6', brand2: '#F9A8D4', soft: '#FDE7F3', name: 'ורוד עדין' },
  sage: { brand: '#7FA98B', brand2: '#A7C4A0', soft: '#E7F2E9', name: 'ירוק מרווה' },
  beige: { brand: '#C89B6D', brand2: '#E6C9A8', soft: '#FBF1E5', name: 'בז׳ חם' },
  berry: { brand: '#C05C8B', brand2: '#E8A0BE', soft: '#FBE7EF', name: 'פוקסיה עמוק' }
};
const BG_OPTIONS = {
  aurora: 'אורורה סגולה', plain: 'נקי ורגוע', warm: 'חם ובז׳', sage: 'מרווה טבעי', night: 'לילה כהה'
};

function applyTheme() {
  const t = S.theme || {};
  const p = THEME_PRESETS[t.preset] || THEME_PRESETS.lavender;
  const root = document.documentElement.style;
  root.setProperty('--brand', t.brand || p.brand);
  root.setProperty('--brand-2', t.brand2 || p.brand2);
  root.setProperty('--brand-soft', p.soft);
  document.body.dataset.bg = t.bg || 'aurora';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.brand || p.brand);
}

/* ---------- toasts ---------- */
function toast(msg, type, ms) {
  let wrap = $('#toasts');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toasts'; wrap.className = 'toasts'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  const icon = type === 'ok' ? '✅' : type === 'err' ? '⚠️' : '✨';
  t.innerHTML = '<span>' + icon + '</span><span>' + esc(msg) + '</span>';
  wrap.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, ms || 2400);
}

/* ---------- sheets ---------- */
let sheetEl = null;
function openSheet(opts) {
  closeSheet(true);
  const back = document.createElement('div');
  back.className = 'backdrop';
  back.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grab"></div>' +
    '<div class="sheet-head"><div class="h2">' + esc(opts.title || '') + '</div>' +
    '<button class="icon-btn" data-close aria-label="סגירה">✕</button></div>' +
    '<div class="sheet-body">' + (opts.body || '') + '</div></div>';
  back.addEventListener('click', (e) => { if (e.target === back) closeSheet(); });
  back.querySelector('[data-close]').addEventListener('click', () => closeSheet());
  document.body.appendChild(back);
  sheetEl = back;
  document.body.style.overflow = 'hidden';
  if (opts.onMount) opts.onMount(back.querySelector('.sheet'));
  return back;
}
function closeSheet(silent) {
  if (sheetEl) { sheetEl.remove(); sheetEl = null; }
  if (!silent) document.body.style.overflow = '';
  else document.body.style.overflow = '';
}
function confirmSheet(title, text, onYes, yesLabel) {
  openSheet({
    title: title,
    body: '<p class="sub" style="margin-bottom:16px">' + esc(text) + '</p>' +
      '<div class="row"><button class="btn danger block" data-yes>' + esc(yesLabel || 'כן, למחוק') + '</button>' +
      '<button class="btn ghost block" data-no>ביטול</button></div>',
    onMount: (root) => {
      root.querySelector('[data-yes]').onclick = () => { closeSheet(); onYes(); };
      root.querySelector('[data-no]').onclick = () => closeSheet();
    }
  });

function formSheet(title, fields, onSubmit, submitLabel) {
  const body = fields.map((f) => {
    const id = 'f_' + f.name;
    let input;
    if (f.type === 'textarea') input = '<textarea class="input" id="' + id + '" placeholder="' + esc(f.ph || '') + '">' + esc(f.value || '') + '</textarea>';
    else if (f.type === 'select') input = '<select class="input" id="' + id + '">' + f.options.map((o) => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(f.value) ? ' selected' : '') + '>' + esc(o.t) + '</option>').join('') + '</select>';
    else if (f.type === 'date') input = '<input class="input" type="date" id="' + id + '" value="' + esc(f.value || todayISO()) + '">';
    else if (f.type === 'time') input = '<input class="input" type="time" id="' + id + '" value="' + esc(f.value || '') + '">';
    else if (f.type === 'number') input = '<input class="input" type="number" id="' + id + '" value="' + esc(f.value == null ? '' : f.value) + '" placeholder="' + esc(f.ph || '') + '"' + (f.min != null ? ' min="' + f.min + '"' : '') + '>';
    else if (f.type === 'color') input = '<input type="color" id="' + id + '" value="' + esc(f.value || '#8B5CF6') + '">';
    else input = '<input class="input" id="' + id + '" value="' + esc(f.value || '') + '" placeholder="' + esc(f.ph || '') + '"' + (f.maxlength ? ' maxlength="' + f.maxlength + '"' : '') + '>';
    return '<div class="field" style="margin-bottom:12px"><label for="' + id + '">' + esc(f.label) + '</label>' + input + '</div>';
  }).join('');
  openSheet({
    title: title,
    body: body + '<button class="btn block" data-submit style="margin-top:6px">' + esc(submitLabel || 'שמירה') + '</button>',
    onMount: (root) => {
      const submit = () => {
        const out = {};
        let ok = true;
        fields.forEach((f) => {
          const el = root.querySelector('#f_' + f.name);
          let v = el.value;
          if (f.type === 'number') v = v === '' ? '' : Number(v);
          if (f.required && (v === '' || v == null)) { ok = false; el.style.borderColor = '#E11D48'; }
          out[f.name] = v;
        });
        if (!ok) { toast('צריך למלא את השדות המסומנים', 'err'); return; }
        closeSheet();
        onSubmit(out);
      };
      root.querySelector('[data-submit]').onclick = submit;
      const first = root.querySelector('.input');
      if (first) setTimeout(() => first.focus(), 120);
      root.querySelectorAll('.input').forEach((el) => {
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && el.tagName !== 'TEXTAREA') { e.preventDefault(); submit(); } });
      });
    }
  });
}

/* ---------- images ---------- */
function compressImage(file, max, quality) {
  max = max || 1100; quality = quality || 0.78;
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); }
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}
function pickImage(cb, max) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    if (f.size > 12 * 1024 * 1024) { toast('התמונה גדולה מדי (מקסימום 12MB)', 'err'); return; }
    compressImage(f, max || 1100).then(cb).catch(() => toast('לא הצלחתי לקרוא את התמונה', 'err'));
  };
  inp.click();
}
function pickImages(cb, max) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const files = Array.from(inp.files || []).slice(0, 9);
    inp.remove();
    if (!files.length) return;
    try {
      const out = [];
      for (const f of files) out.push(await compressImage(f, max || 1000));
      cb(out);
    } catch (e) { toast('שגיאה בטעינת התמונות', 'err'); }
  };
  inp.click();
}

/* ---------- streak ---------- */
function touchStreak() {
  const t = todayISO();
  if (S.streak.last === t) return;
  const y = iso(addDays(new Date(), -1));
  S.streak.count = S.streak.last === y ? (S.streak.count || 1) + 1 : 1;
  S.streak.last = t;
  S.stats.days = (S.stats.days || []).concat([t]).slice(-400);
  save();
}

/* ---------- reminders ---------- */
let reminderTimer = null;
function initReminders() {
  if (reminderTimer) return;
  const tick = () => {
    if (!S.user || !S.prefs.notify) return;
    const now = new Date();
    const t = todayISO();
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    S.events.forEach((ev) => {
      if (ev.date !== t || !ev.time || ev.notified || ev.done) return;
      if (ev.time === hhmm) {
        ev.notified = true; save();
        const msg = 'תזכורת: ' + ev.title + ' בשעה ' + ev.time;
        toast(msg, 'info', 5000);
        notifyNative('MIXIT · ' + ev.title, ev.time + (ev.notes ? ' · ' + ev.notes : ''));
      }
    });
    // due-day reminders for homework
    S.homework.forEach((hw) => {
      if (hw.done || hw.notified || hw.due !== t) return;
      hw.notified = true; save();
      toast('שיעורי בית להיום: ' + hw.title, 'info', 4200);
    });
  };
  reminderTimer = setInterval(tick, 30000);
  tick();
}
function notifyNative(title, body) {
  try {
    if (S.prefs.notify && 'Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body: body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌈</text></svg>' });
    }
  } catch (e) { /* ignore */ }
}
function askNotifications() {
  if (!('Notification' in window)) { toast('הדפדפן הזה לא תומך בהתראות', 'err'); return; }
  if (Notification.permission === 'granted') { S.prefs.notify = true; save(); toast('התראות פעילות', 'ok'); render(); return; }
  Notification.requestPermission().then((p) => {
    S.prefs.notify = p === 'granted';
    save(); render();
    toast(p === 'granted' ? 'התראות הופעלו' : 'לא אושרו התראות. אפשר להפעיל בהגדרות הדפדפן', p === 'granted' ? 'ok' : 'err');
  }).catch(() => toast('לא הצלחתי להפעיל התראות', 'err'));
}

/* ---------- global search ---------- */
function searchAll(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return [];
  const out = [];
  const push = (type, icon, title, sub, screen, extra) => out.push({ type, icon, title, sub, screen, extra });
  S.tasks.forEach((t) => { if ((t.title + ' ' + (t.notes || '')).toLowerCase().includes(q)) push('משימה', '✅', t.title, (t.done ? 'הושלמה' : 'פתוחה') + (t.notes ? ' · ' + t.notes : ''), 'organizer', { tab: 'tasks' }); });
  S.events.forEach((e) => { if ((e.title + ' ' + (e.notes || '')).toLowerCase().includes(q)) push('יומן', '📅', e.title, fmtLong(e.date) + (e.time ? ' · ' + e.time : ''), 'organizer', { tab: 'calendar' }); });
  S.homework.forEach((h) => { if ((h.title + ' ' + h.subject).toLowerCase().includes(q)) push('לימודים', '📚', h.title, h.subject + ' · ' + fmtNice(h.due), 'organizer', { tab: 'study' }); });
  S.goals.forEach((g) => { if (g.title.toLowerCase().includes(q)) push('מטרה', '🎯', g.title, g.current + '/' + g.target + ' ' + (g.unit || ''), 'organizer', { tab: 'goals' }); });
  S.shopping.forEach((s) => { if (s.name.toLowerCase().includes(q)) push('קניות', '🛒', s.name, s.done ? 'נקנה' : 'ברשימה', 'organizer', { tab: 'lists' }); });
  S.wishes.forEach((w) => { if (w.title.toLowerCase().includes(q)) push('משאלות', '🎁', w.title, w.got ? 'יש!' : (w.price ? w.price + ' ₪' : ''), 'organizer', { tab: 'lists' }); });
  S.budget.entries.forEach((b) => { if ((b.desc + ' ' + b.cat).toLowerCase().includes(q)) push('תקציב', '💰', b.desc, b.amount + ' ₪ · ' + fmtShort(b.date), 'organizer', { tab: 'budget' }); });
  S.designs.forEach((d) => { if ((d.title || '').toLowerCase().includes(q)) push('עיצוב', '🎨', d.title || 'עיצוב', d.type, 'create', { open: d.id }); });
  ACTIVITIES.forEach((a) => { if ((a.title + ' ' + a.desc).toLowerCase().includes(q)) push('פעילות', a.icon || '🎲', a.title, a.desc.slice(0, 60), 'next', { activity: a.id }); });
  S.activities.custom.forEach((a) => { if ((a.title + ' ' + (a.desc || '')).toLowerCase().includes(q)) push('פעילות שלי', '⭐', a.title, a.desc || '', 'next', { activity: a.id }); });
  return out.slice(0, 40);
}

function openSearch() {
  openSheet({
    title: 'חיפוש בכל MIXIT',
    body: '<input class="input" id="q" placeholder="חפשו משימה, אירוע, עיצוב, רעיון…" autocomplete="off">' +
      '<div id="results" style="margin-top:14px"></div>',
    onMount: (root) => {
      const q = root.querySelector('#q');
      const res = root.querySelector('#results');
      const draw = () => {
        const items = searchAll(q.value);
        if (!q.value.trim()) {
          res.innerHTML = '<p class="muted" style="text-align:center;padding:18px">אפשר לחפש בכל חלקי האפליקציה: משימות, יומן, לימודים, תקציב, עיצובים ורעיונות.</p>';
          return;
        }
        if (!items.length) { res.innerHTML = '<div class="empty">לא נמצאו תוצאות עבור “' + esc(q.value) + '”</div>'; return; }
        res.innerHTML = items.map((it, i) => '<button class="item" data-i="' + i + '" style="width:100%;text-align:start;margin-bottom:8px">' +
          '<span style="font-size:19px">' + it.icon + '</span><span class="sp"><span class="item-title">' + esc(it.title) + '</span>' +
          '<span class="item-sub">' + esc(it.type) + ' · ' + esc(it.sub) + '</span></span><span style="color:var(--ink-3)">›</span></button>').join('');
        $$('[data-i]', res).forEach((b) => {
          b.onclick = () => {
            const it = items[Number(b.dataset.i)];
            closeSheet();
            if (it.extra && it.extra.tab) UI.tab.organizer = it.extra.tab;
            go(it.screen);
            if (it.extra && it.extra.open && window.Studio) setTimeout(() => Studio.openSaved(it.extra.open), 240);
            if (it.extra && it.extra.activity && window.Next) setTimeout(() => Next.showById(it.extra.activity), 240);
          };
        });
      };
      q.addEventListener('input', draw);
      draw();
      setTimeout(() => q.focus(), 150);
    }
  });
}

  slide: 0, timer: null, playing: true, form: null,

  render(view) {
    clearInterval(this.timer);
    if (!S.seenIntro) this.renderIntro(view);

  renderIntro(view) {
    const self = this;
    const s = INTRO_SLIDES[this.slide] || INTRO_SLIDES[0];
    view.innerHTML =
      '<div class="onb">' +
      '<div class="orb" style="width:300px;height:300px;background:#A78BFA;top:-90px;inset-inline-start:-80px"></div>' +

      '<div class="slide" style="background:' + s.bg + '">' +
      '<div class="art">' + s.art + '</div>' +
      '<div class="badge" style="background:rgba(255,255,255,.24);color:#fff">' + esc(s.sub) + '</div>' +
      '<h2>' + esc(s.title) + '</h2>' +
      '<p>' + esc(s.text) + '</p>' +
      '</div>' +
      '<div class="slide-dots">' + INTRO_SLIDES.map((_, i) => '<i class="' + (i === this.slide ? 'on' : '') + '"></i>').join('') + '</div>' +
      '<div class="onb-controls">' +
      '<button class="icon-btn" data-prev aria-label="הקודם">‹</button>' +
      '<button class="btn ghost sm" data-play>' + (this.playing ? '⏸ עצור' : '▶ הפעל') + '</button>' +
      (this.slide === INTRO_SLIDES.length - 1
        ? '<button class="btn" data-next>יאללה, מתחילים ✨</button>'
        : '<button class="icon-btn" data-next aria-label="הבא">›</button>') +
      '</div>' +
      '<div style="text-align:center;margin-top:14px"><button class="muted" data-skip style="text-decoration:underline">דלגו על ההסבר</button></div>' +
      '</div></div>';

    const next = () => {
      if (this.slide >= INTRO_SLIDES.length - 1) { this.finishIntro(); return; }
      this.slide++; this.renderIntro(view); this.startAuto(view);
    };
    $('[data-next]', view).onclick = next;
    $('[data-prev]', view).onclick = () => { this.slide = Math.max(0, this.slide - 1); this.renderIntro(view); this.startAuto(view); };
    $('[data-play]', view).onclick = () => { this.playing = !this.playing; this.renderIntro(view); this.startAuto(view); };
    $('[data-skip]', view).onclick = () => this.finishIntro();
    this.startAuto(view);

    clearInterval(this.timer);

    const self = this;

      if (self.slide >= INTRO_SLIDES.length - 1) { clearInterval(self.timer); return; }
      self.slide++;
      const v = document.getElementById('view');
      if (v) { self.renderIntro(v); self.startAuto(v); }
    }, 6200);

      '<input class="input" id="age" type="number" min="6" max="120" placeholder="בן/בת כמה?" value="' + esc(f.age) + '"></div>' +
      '<button class="btn block" data-start>בואו נתחיל ✨</button>' +
      '<p class="tiny" style="text-align:center;margin-top:12px">הכל נשמר מקומית במכשיר שלך. אין צורך בסיסמה.</p>' +
      '</div>' +
      '<div style="text-align:center;margin-top:14px"><button class="muted" data-back style="text-decoration:underline">חזרה להצגה</button></div>' +
      '</div></div>';

    const fn = $('#fn', view), ln = $('#ln', view), age = $('#age', view);
    fn.oninput = () => { f.first = fn.value; };
    ln.oninput = () => { f.last = ln.value; };
    age.oninput = () => { f.age = age.value; };
    $$('[data-av]', view).forEach((b) => {
      b.onclick = () => { f.avatar = b.dataset.av; this.renderSignup(view); };
    });
    $('[data-back]', view).onclick = () => { S.seenIntro = false; this.slide = 0; this.renderIntro(view); };
    const submit = () => {
      const first = fn.value.trim(), last = ln.value.trim();
      if (first.length < 2) { toast('צריך שם פרטי (לפחות 2 אותיות)', 'err'); fn.focus(); return; }
      S.user = {
        first: first,
        last: last,
        avatar: f.avatar || AVATARS[0],
        age: age.value ? Number(age.value) : null,
        joined: todayISO()
      };
      S.seenIntro = true;
      save(true);
      touchStreak();
      checkAchievements();
      UI.screen = 'home';
      render();
      toast('ברוכים הבאים ל-MIXIT, ' + first + '! 🎉', 'ok', 3200);
    };
    $('[data-start]', view).onclick = submit;
    [fn, ln, age].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); }));
    setTimeout(() => fn.focus(), 200);
  }
};

    if (h < 21) return 'ערב טוב';
    return 'לילה טוב';

  ensureDaily() {
    const t = todayISO();
    if (!S.daily || S.daily.date !== t) {
      const seed = Math.floor(parseISO(t).getTime() / 86400000);
      S.daily = { date: t, ideaId: ACTIVITIES[seed % ACTIVITIES.length].id, challengeDone: false, seed: seed };
